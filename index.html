<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Obfuscator by Lyn</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0d0d0d; color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .container {
            width: 100%; max-width: 1000px; background: #1a1a1a;
            border-radius: 16px; padding: 30px;
            box-shadow: 0 0 40px rgba(0,255,136,0.3); border: 1px solid #2e2e2e;
        }
        h1 {
            text-align: center; color: #00ff88; margin-bottom: 10px;
            font-size: 2.2rem; text-shadow: 0 0 10px #00ff88aa;
        }
        .subtitle {
            text-align: center; color: #aaa; margin-bottom: 30px; font-style: italic;
        }
        .subtitle a { color: #00ccff; text-decoration: none; }
        textarea {
            width: 100%; height: 250px; background: #121212; border: 1px solid #444;
            color: #0f0; font-family: 'Courier New', monospace; padding: 15px;
            border-radius: 10px; resize: vertical; font-size: 14px; margin-bottom: 20px;
        }
        textarea:focus { outline: none; border-color: #00ff88; box-shadow: 0 0 15px #00ff8833; }
        .btn-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        button {
            background: #00ff88; border: none; color: #000; padding: 12px 30px;
            font-weight: bold; font-size: 16px; border-radius: 30px; cursor: pointer;
            transition: all 0.3s; letter-spacing: 0.5px; box-shadow: 0 0 15px #00ff8866;
        }
        button:hover { background: #00cc6a; box-shadow: 0 0 25px #00ff88; transform: scale(1.05); }
        button.copy { background: #00ccff; box-shadow: 0 0 15px #00ccff66; }
        button.copy:hover { background: #009fcc; box-shadow: 0 0 25px #00ccff; }
        .label {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 5px; color: #ccc;
        }
        .small-note { font-size: 0.8rem; color: #888; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ LUA OBFUSCATOR</h1>
        <div class="subtitle">
            obfuscate by <strong>lyn tiktok</strong>
            <a href="https://tiktok.com/@lyn_thich_em_jk" target="_blank">tiktok.com/@lyn_thich_em_jk</a>
        </div>
        <div class="label"><span>📝 Script gốc (Lua)</span></div>
        <textarea id="input" placeholder="-- Dán script Lua của bạn vào đây..."></textarea>
        <div class="btn-group">
            <button onclick="obfuscate()">🔒 Mã hóa siêu nặng</button>
            <button class="copy" onclick="copyResult()">📋 Copy kết quả</button>
        </div>
        <div class="label"><span>✨ Script đã mã hóa</span><span id="status" style="color:#00ff88;"></span></div>
        <textarea id="output" placeholder="Kết quả sẽ hiện ở đây..." readonly></textarea>
        <div class="small-note">
            ⚡ Tương thích Lua 5.1 / 5.2+ (tự động chọn <code>load</code> hoặc <code>loadstring</code>).<br>
            🔐 Script vẫn chạy y hệt, không lỗi, bọc kín hoàn toàn.
        </div>
    </div>

    <script>
        function toOct(str) {
            let r = '';
            for (let i = 0; i < str.length; i++) {
                let c = str.charCodeAt(i).toString(8);
                while (c.length < 3) c = '0' + c;
                r += '\\' + c;
            }
            return r;
        }

        function rndName(len) {
            const ch = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let n = '';
            for (let i = 0; i < len; i++) n += ch[Math.floor(Math.random() * ch.length)];
            return n;
        }

        function obfuscate() {
            const input = document.getElementById('input').value;
            const statusEl = document.getElementById('status');
            if (!input.trim()) {
                statusEl.textContent = '❌ Vui lòng nhập script!';
                statusEl.style.color = '#ff4444';
                return;
            }
            statusEl.textContent = '⏳ Đang mã hóa siêu nặng...';
            statusEl.style.color = '#ffaa00';

            setTimeout(() => {
                try {
                    // 1. Chia script thành các chunk nhỏ
                    let chunkSize = 3 + Math.floor(Math.random() * 5); // 3~7
                    let chunks = [];
                    for (let i = 0; i < input.length; i += chunkSize) {
                        chunks.push(input.substring(i, i + chunkSize));
                    }

                    // 2. Tạo mảng W_raw ban đầu chỉ chứa chunk thật (đã escape octal)
                    let W_raw = chunks.map(c => '"' + toOct(c) + '"');

                    // 3. Chèn rác vào trước và xen kẽ
                    let junkBefore = 2 + Math.floor(Math.random() * 5);
                    let junkMiddle = 4 + Math.floor(Math.random() * 8);
                    let finalW = [];
                    // a) Thêm rác trước
                    for (let i = 0; i < junkBefore; i++) {
                        let len = 2 + Math.floor(Math.random() * 4);
                        let s = '';
                        for (let j = 0; j < len; j++) s += String.fromCharCode(32 + Math.floor(Math.random() * 90));
                        finalW.push('"' + toOct(s) + '"');
                    }
                    // b) Trộn chunk thật với rác
                    let realPositions = []; // lưu vị trí (index 0-based) của chunk thật trong finalW
                    let realIdx = 0;
                    let junkRemain = junkMiddle;
                    while (realIdx < W_raw.length) {
                        finalW.push(W_raw[realIdx]);
                        realPositions.push(finalW.length - 1); // vị trí của chunk thứ realIdx
                        realIdx++;
                        if (junkRemain > 0 && Math.random() < 0.4) {
                            let len = 2 + Math.floor(Math.random() * 4);
                            let s = '';
                            for (let j = 0; j < len; j++) s += String.fromCharCode(32 + Math.floor(Math.random() * 90));
                            finalW.push('"' + toOct(s) + '"');
                            junkRemain--;
                        }
                    }
                    // c) Thêm nốt rác còn lại vào cuối
                    for (let i = 0; i < junkRemain; i++) {
                        let len = 2 + Math.floor(Math.random() * 4);
                        let s = '';
                        for (let j = 0; j < len; j++) s += String.fromCharCode(32 + Math.floor(Math.random() * 90));
                        finalW.push('"' + toOct(s) + '"');
                    }

                    // 4. Tính offset cho hàm X
                    // Vị trí của chunk đầu tiên trong Lua (index từ 1) = realPositions[0] + 1
                    let firstIndex = realPositions[0] + 1;
                    let B = Math.floor(Math.random() * 60000) + 10000;
                    let A = B + firstIndex;
                    let offsetExpr = `${A}+-${B}`; // X + (A-B) = X + firstIndex -> trả về chunk thứ X

                    // 5. Tạo tên biến
                    let Wname = rndName(2);
                    let Xname = rndName(1);
                    let fname = rndName(3);
                    let sname = rndName(2);
                    let lname = rndName(1);

                    // 6. Tạo danh sách gọi X(i) với biểu thức phức tạp
                    let calls = realPositions.map((pos, i) => {
                        // Để rối mắt, tham số là i nhưng biểu diễn phức tạp
                        let val = i;
                        let x = Math.floor(Math.random() * 8000) + 2000;
                        let y = x - val;
                        return `${Xname}(${x}+-${y})`; // luôn ra val
                    });

                    // 7. Script loader
                    let loader = `
local ${sname}=table.concat({${calls.join(',')}})
local ${lname}=load or loadstring
local ${fname}=${lname}(${sname})
if ${fname} then
    ${fname}(...)
end
`;
                    let finalScript = `-- obfuscate by lyn tiktok tiktok.com/@lyn_thich_em_jk
local ${Wname}={${finalW.join(',')}} 
local function ${Xname}(${Xname})return ${Wname}[${Xname}+(${offsetExpr})]end ${loader}`;

                    document.getElementById('output').value = finalScript;
                    statusEl.textContent = '✅ Mã hóa siêu nặng thành công!';
                    statusEl.style.color = '#00ff88';
                } catch (e) {
                    statusEl.textContent = '❌ Lỗi: ' + e.message;
                    statusEl.style.color = '#ff4444';
                }
            }, 50);
        }

        function copyResult() {
            let out = document.getElementById('output');
            out.select();
            document.execCommand('copy');
            let st = document.getElementById('status');
            st.textContent = '📋 Đã copy vào clipboard!';
            st.style.color = '#00ccff';
            setTimeout(() => { if (st.textContent === '📋 Đã copy vào clipboard!') st.textContent = ''; }, 2000);
        }
        document.getElementById('input').addEventListener('paste', () => {
            setTimeout(() => { document.getElementById('status').textContent = ''; }, 100);
        });
    </script>
</body>
</html>
