<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS2DevHub - Get Key</title>
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background-color: #1e1e1e; 
            padding: 30px; 
            border-radius: 12px; 
            text-align: center; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.5); 
            width: 350px;
        }
        h2 { margin-top: 0; color: #00ff88; }
        button { 
            background-color: #007bff; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            margin: 15px 0; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%;
            transition: 0.3s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #555555; cursor: not-allowed; color: #999; }
        #keyDisplay { 
            margin-top: 20px; 
            font-size: 22px; 
            font-weight: bold; 
            color: #00ff88; 
            background: #2a2a2a;
            padding: 10px;
            border-radius: 6px;
            display: none;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>SS2DevHub Key</h2>
        <p>Bước 1: Sao chép đoạn text dưới đây để mở khóa hệ thống</p>
        <button id="copyBtn" onclick="copyText()">Sao chép @ss2dev</button>

        <p>Bước 2: Lấy Key Script</p>
        <button id="getKeyBtn" onclick="generateKey()" disabled>Tạo Key Random</button>

        <div id="keyDisplay"></div>
    </div>

    <script>
        // Hàm sao chép và mở khóa nút lấy key
        function copyText() {
            navigator.clipboard.writeText("@ss2dev").then(() => {
                alert("Đã sao chép: @ss2dev thành công! Bạn có thể tạo Key ngay bây giờ.");
                
                // Mở khóa nút Tạo Key
                document.getElementById("getKeyBtn").disabled = false;
                document.getElementById("getKeyBtn").style.backgroundColor = "#28a745"; // Đổi màu xanh lá
                
                // Thay đổi trạng thái nút Copy
                document.getElementById("copyBtn").innerText = "Đã sao chép ✔️";
                document.getElementById("copyBtn").disabled = true; // Không cho bấm lại
            }).catch(err => {
                alert("Lỗi sao chép, vui lòng thử lại!");
            });
        }

        // Hàm tạo key ngẫu nhiên
        function generateKey() {
            // Tạo một số ngẫu nhiên từ 10000 đến 99999
            let randomNum = Math.floor(Math.random() * 90000) + 10000; 
            let finalKey = "ss2dev-" + randomNum;
            
            // Hiển thị Key ra màn hình
            let displayBlock = document.getElementById("keyDisplay");
            displayBlock.style.display = "block";
            displayBlock.innerText = finalKey;
            
            // Tự động sao chép key luôn cho người dùng tiện dán vào Roblox
            navigator.clipboard.writeText(finalKey);
            alert("Đã tạo và tự động sao chép Key: " + finalKey);
        }
    </script>

</body>
</html>
