<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyn AI Voice</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #ff6b81; margin-bottom: 5px; }
        p { text-align: center; color: #777; font-size: 14px; margin-top: 0; }
        textarea {
            width: 100%; height: 120px; padding: 10px;
            border: 1px solid #ccc; border-radius: 8px;
            font-size: 16px; margin-bottom: 15px; resize: none;
            box-sizing: border-box;
        }
        select {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 1px solid #ccc; border-radius: 8px;
            font-size: 15px; background: #fff;
        }
        button {
            width: 100%; padding: 15px; background-color: #ff6b81;
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        button:active { background-color: #ff4757; }
    </style>
</head>
<body>

<div class="container">
    <h2>Lyn AI Voice 🎙️</h2>
    <p>Chuyển văn bản thành giọng nói</p>

    <textarea id="textInput" placeholder="Nhập văn bản vào đây... Ví dụ: Xin chào, tôi là Lyn AI."></textarea>
    
    <select id="voiceSelect">
        <option value="">Đang tải danh sách giọng nói...</option>
    </select>
    
    <button onclick="speakText()">Phát Âm Thanh</button>
</div>

<script>
    let synth = window.speechSynthesis;
    let voiceSelect = document.getElementById('voiceSelect');
    let voices = [];

    // Tải danh sách giọng nói có sẵn trên điện thoại của bạn
    function populateVoiceList() {
        voices = synth.getVoices();
        voiceSelect.innerHTML = '';
        
        let hasVietnamese = false;

        voices.forEach((voice) => {
            // Lọc ra các giọng Tiếng Việt và Tiếng Anh phổ biến để dễ chọn
            if(voice.lang.includes('vi') || voice.lang.includes('en')) {
                let option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.setAttribute('data-lang', voice.lang);
                option.setAttribute('data-name', voice.name);
                voiceSelect.appendChild(option);
                
                if(voice.lang.includes('vi')) hasVietnamese = true;
            }
        });

        if(!hasVietnamese) {
            let option = document.createElement('option');
            option.textContent = "Không tìm thấy giọng Tiếng Việt, dùng giọng mặc định";
            voiceSelect.appendChild(option);
        }
    }

    // Một số thiết bị cần thời gian để tải giọng nói
    populateVoiceList();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    // Hàm đọc văn bản
    function speakText() {
        if (synth.speaking) {
            console.error('Đang nói rồi...');
            return;
        }
        let textInput = document.getElementById('textInput').value;
        if (textInput !== '') {
            let utterThis = new SpeechSynthesisUtterance(textInput);
            let selectedOption = voiceSelect.selectedOptions[0].getAttribute('data-name');
            for (let i = 0; i < voices.length; i++) {
                if (voices[i].name === selectedOption) {
                    utterThis.voice = voices[i];
                    break;
                }
            }
            // Tốc độ và cao độ (có thể chỉnh)
            utterThis.pitch = 1;
            utterThis.rate = 1;
            synth.speak(utterThis);
        } else {
            alert("Vui lòng nhập văn bản!");
        }
    }
</script>

</body>
</html>
