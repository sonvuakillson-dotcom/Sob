<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lynHub Cloud Obfuscator Panel</title>
    <style>
        :root {
            --bg: #060709;
            --panel: #0d1117;
            --border: #30363d;
            --accent: #238636;
            --text: #c9d1d9;
            --cyan: #58a6ff;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 30px 10px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; color: var(--cyan); margin-top: 0; font-size: 24px; text-transform: uppercase;}
        .config-box {
            background: #161b22;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        label { font-size: 13px; font-weight: bold; display: block; margin-bottom: 5px; color: #8b949e;}
        input, textarea {
            width: 100%;
            background: #010409;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #58a6ff;
            padding: 10px;
            box-sizing: border-box;
            font-family: monospace;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--cyan); }
        textarea { height: 140px; color: #7ee787; }
        button {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #2ea44f; }
        .output-zone { margin-top: 20px; }
        .result-box {
            background: #161b22;
            border: 1px dashed var(--cyan);
            padding: 15px;
            border-radius: 6px;
            color: #f0f6fc;
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ lynHub Cloud Security Panel</h1>
    <p style="text-align: center; color: #8b949e; font-size: 13px; margin-bottom: 20px;">Hệ thống tự động đồng bộ GitHub - Kín tuyệt đối không lộ mã nguồn</p>

    <div class="config-box">
        <div class="grid">
            <div>
                <label>Tên tài khoản GitHub:</label>
                <input type="text" id="ghUser" placeholder="Ví dụ: lynHubOfficial">
            </div>
            <div>
                <label>Tên Repository (Kho lưu trữ công khai):</label>
                <input type="text" id="ghRepo" placeholder="Ví dụ: cloud-script">
            </div>
        </div>
        <div>
            <label>GitHub Personal Access Token (Token cấp quyền ghi file):</label>
            <input type="password" id="ghToken" placeholder="github_pat_...">
        </div>
    </div>

    <label>Dán Script gốc cần bảo mật vào đây:</label>
    <textarea id="inputScript" placeholder="-- Dán mã nguồn Lua/Luau của bạn tại đây..."></textarea>

    <button onclick="deploySecureScript()">🔒 BẢO MẬT & ĐẨY LÊN CLOUD LẤY LOADSTRING</button>

    <div class="output-zone">
        <label>Mã Loadstring đầu ra (Dán vào Executor để chạy):</label>
        <div id="outputLoadstring" class="result-box">Đang chờ lệnh bảo mật...</div>
    </div>
</div>

<script>
    // Tự động tải lại cấu hình cũ đã lưu trên máy người dùng cho tiện
    document.getElementById('ghUser').value = localStorage.getItem('lyn_user') || '';
    document.getElementById('ghRepo').value = localStorage.getItem('lyn_repo') || '';
    document.getElementById('ghToken').value = localStorage.getItem('lyn_token') || '';

    async function deploySecureScript() {
        const user = document.getElementById('ghUser').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();
        const token = document.getElementById('ghToken').value.trim();
        const scriptData = document.getElementById('inputScript').value.trim();

        if (!user || !repo || !token || !scriptData) {
            alert('Vui lòng nhập đầy đủ thông tin cấu hình GitHub và Script gốc!');
            return;
        }

        // Lưu lại cấu hình vào trình duyệt để lần sau không phải nhập lại
        localStorage.setItem('lyn_user', user);
        localStorage.setItem('lyn_repo', repo);
        localStorage.setItem('lyn_token', token);

        document.getElementById('outputLoadstring').innerText = "⚡ Hệ thống đang mã hóa dữ liệu và tải lên Đám Mây Độc Quyền...";

        try {
            // 1. Tạo số ngẫu nhiên theo đúng format lynHub của bạn
            const randomID = Math.floor(10000000 + Math.random() * 89999999);
            const fileName = `lynHubSecurity73821${randomID}.lua`;

            // 2. Thuật toán Super Obfuscate: Chuyển code thành mảng số Byte mã hóa tầng sâu
            const encoder = new TextEncoder();
            const bytes = encoder.encode(scriptData);
            let obfuscatedArray = [];
            for (let i = 0; i < bytes.length; i++) {
                obfuscatedArray.push((bytes[i] ^ 77) + 3); // Kỹ thuật xáo trộn bit kép
            }
            const byteString = obfuscatedArray.join(',');

            // 3. Tạo nội dung File "Kín" (Nếu mở bằng web sẽ tưởng là trang lỗi 404 hoặc file hỏng)
            // Kéo xuống hàng trăm dòng trống mới thấy mớ số hỗn độn đã mã hóa
            let fakeSpaces = "\n".repeat(150); // Tạo 150 dòng trống để đánh lừa
            const finalFileContent = `-- [lynHub Cloud Security Protocol] --
-- ERROR 404: HTTP FETCH FORBIDDEN --
-- The requested identity could not be decrypted via web browser.
-- Connection: Closed Successfully.
----------------------------------------------------------------------${fakeSpaces}
local _0xlynCore = {${byteString}}
local _0xruntime = {}
for i = 1, #_0xlynCore do
    _0xruntime[i] = string.char((_0xlynCore[i] - 3) ~ 77)
end
local _0xcompiled = loadstring(table.concat(_0xruntime, ""))
if _0xcompiled then _0xcompiled() end`;

            // 4. Tiến hành đẩy file lên GitHub API
            const url = `https://api.github.com/repos/${user}/${repo}/contents/${fileName}`;
            const base64Content = btoa(unescape(encodeURIComponent(finalFileContent)));

            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Security Lock Active For ID ${randomID}`,
                    content: base64Content
                })
            });

            if (response.ok) {
                // Đường link trực tiếp dẫn tới file raw của GitHub
                const rawLink = `https://raw.githubusercontent.com/${user}/${repo}/main/${fileName}`;
                
                // Trả về đúng cấu trúc loadstring bạn yêu cầu
                const finalLoadstring = `loadstring(game:HttpGet("${rawLink}", true))()`;
                
                document.getElementById('outputLoadstring').innerText = finalLoadstring;
                alert('🎉 ĐÃ BẢO MẬT & TẠO LINK THÀNH CÔNG!');
            } else {
                const errData = await response.json();
                document.getElementById('outputLoadstring').innerText = "❌ Lỗi GitHub: " + errData.message;
            }

        } catch (e) {
            document.getElementById('outputLoadstring').innerText = "❌ Lỗi hệ thống: " + e.message;
        }
    }
</script>

</body>
</html>
