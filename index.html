<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyn Hub - Get Script</title>
    <!-- Nhúng FontAwesome để lấy icon TikTok, YouTube và Copy -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #1a162b;
            --accent-color: #bb86fc;
            --tiktok-color: #fe2c55;
            --youtube-color: #ff0000;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fe2c55, #ff0000, #bb86fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .btn-zone {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s, filter 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn-link:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        .btn-tiktok {
            background-color: var(--tiktok-color);
        }

        .btn-youtube {
            background-color: var(--youtube-color);
        }

        .btn-verify {
            background-color: #31a24c;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            display: none; /* Ẩn đi, hiện khi bấm đủ 2 link */
        }

        .countdown-text {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin: 15px 0;
            display: none;
        }

        /* Khối hiển thị Script khi unlock thành công */
        .script-box {
            display: none; /* Ẩn mặc định */
            text-align: left;
            margin-top: 10px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .script-title {
            font-size: 1.3rem;
            color: #4cd137;
            text-align: center;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .script-sub {
            font-size: 1rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 15px;
        }

        .code-container {
            position: relative;
            background-color: #0b0914;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        textarea {
            width: 100%;
            height: 100px;
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            resize: none;
            outline: none;
        }

        .btn-copy {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background-color: #d2b4ff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- KHỐI LÀM NHIỆM VỤ (GET SCRIPT) -->
        <div id="gate-zone">
            <h1>Lyn Hub</h1>
            <p class="subtitle">Vui lòng hoàn thành nhiệm vụ để mở khóa Script</p>
            
            <div class="btn-zone">
                <a href="https://www.tiktok.com/@ta_thieu_nang_do_la_no?_r=1&_t=ZS-97LE5gdLTmv" target="_blank" class="btn-link btn-tiktok" id="tiktok-btn">
                    <i class="fab fa-tiktok"></i> Follow TikTok
                </a>
                <a href="https://youtube.com/@lyn_gaminggamer?si=jJyBH40fYDxIP1wB" target="_blank" class="btn-link btn-youtube" id="youtube-btn">
                    <i class="fab fa-youtube"></i> Đăng ký YouTube
                </a>
            </div>

            <button class="btn-verify" id="verify-btn">XÁC NHẬN ĐÃ HOÀN THÀNH</button>
            <div class="countdown-text" id="countdown-zone">Đang kiểm tra... Vui lòng đợi <span id="timer">5</span> giây</div>
        </div>

        <!-- KHỐI HIỂN THỊ SCRIPT ĐÃ MỞ KHÓA -->
        <div class="script-box" id="script-zone">
            <p class="script-title"><i class="fas fa-check-circle"></i> Script của bạn đây</p>
            <p class="script-sub">Lyn Hub Kick a Lucky Blox</p>
            
            <div class="code-container">
                <textarea id="script-code" readonly>loadstring(game:HttpGet("https://raw.githubusercontent.com/sonvuakillson-dotcom/Sob/main/Script%20kick%20a%20lucky%20blox%20by%20Lyn%20no%20key%20best"))()</textarea>
            </div>

            <button class="btn-copy" id="copy-btn">
                <i class="fas fa-copy"></i> Sao chép Script
            </button>
        </div>
    </div>

    <script>
        const tiktokBtn = document.getElementById('tiktok-btn');
        const youtubeBtn = document.getElementById('youtube-btn');
        const verifyBtn = document.getElementById('verify-btn');
        const countdownZone = document.getElementById('countdown-zone');
        const timerText = document.getElementById('timer');
        const gateZone = document.getElementById('gate-zone');
        const scriptZone = document.getElementById('script-zone');
        const copyBtn = document.getElementById('copy-btn');
        const scriptCode = document.getElementById('script-code');

        let clickedTiktok = false;
        let clickedYoutube = false;

        // Bắt sự kiện click nút TikTok
        tiktokBtn.addEventListener('click', () => {
            clickedTiktok = true;
            checkButtons();
        });

        // Bắt sự kiện click nút YouTube
        youtubeBtn.addEventListener('click', () => {
            clickedYoutube = true;
            checkButtons();
        });

        // Kiểm tra xem người dùng đã bấm vào cả 2 link chưa
        function checkButtons() {
            if (clickedTiktok && clickedYoutube) {
                verifyBtn.style.display = 'block';
            }
        }

        // Bắt sự kiện bấm nút Xác nhận
        verifyBtn.addEventListener('click', () => {
            verifyBtn.style.display = 'none';
            countdownZone.style.display = 'block';
            
            let timeLeft = 5;
            const interval = setInterval(() => {
                timeLeft--;
                timerText.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    // Ẩn khu vực nhiệm vụ và hiện Script
                    gateZone.style.display = 'none';
                    scriptZone.style.display = 'block';
                }
            }, 1000);
        });

        // Bắt sự kiện nút Copy
        copyBtn.addEventListener('click', () => {
            scriptCode.select();
            scriptCode.setSelectionRange(0, 99999); // Dành cho thiết bị di động

            navigator.clipboard.writeText(scriptCode.value).then(() => {
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Đã sao chép thành công!';
                copyBtn.style.backgroundColor = '#4cd137';
                
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fas fa-copy"></i> Sao chép Script';
                    copyBtn.style.backgroundColor = 'var(--accent-color)';
                }, 2000);
            }).catch(err => {
                alert('Có lỗi xảy ra khi copy, hãy tự bôi đen để copy nhé!');
            });
        });
    </script>
</body>
</html>
