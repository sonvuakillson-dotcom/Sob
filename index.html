<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SS2DEVHUB | Ultimate Obfuscator Tool</title>
<style>
  /* ==========================================
     GIAO DIỆN CÔNG CỤ MÃ HÓA (GENERATOR)
     ========================================== */
  :root {
    --bg: #05080c; --panel: #0d1219;
    --accent: #00ffcc; --accent-hover: #00e6b8;
    --border: #1a222d; --text: #e1e7ed;
  }

  body {
    margin: 0; padding: 20px; min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    background: radial-gradient(circle at top, #0f1722, var(--bg));
    font-family: 'Segoe UI', sans-serif; box-sizing: border-box;
  }

  /* Hiệu ứng nền */
  body::before {
    content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image: radial-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px);
    background-size: 20px 20px; z-index: 0; pointer-events: none;
  }

  .container {
    position: relative; z-index: 10;
    width: 100%; max-width: 800px; padding: 30px;
    background: rgba(13, 18, 25, 0.8);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(0,255,204,0.05);
  }

  .header { text-align: center; margin-bottom: 25px; }
  .title {
    color: #fff; font-size: 28px; font-weight: 900; margin: 0;
    letter-spacing: 3px; background: linear-gradient(90deg, var(--accent), #0099ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--accent); font-size: 12px; letter-spacing: 2px; font-family: monospace; }

  /* Khu vực 2 ô nhập/xuất */
  .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 600px) { .grid-layout { grid-template-columns: 1fr; } }

  .box-wrap { display: flex; flex-direction: column; gap: 10px; }
  .box-title { color: #8b9bb4; font-size: 13px; font-weight: bold; text-transform: uppercase; }
  
  textarea {
    width: 100%; height: 250px; background: #070a0f; color: #a2adb8;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 15px; font-family: 'Courier New', monospace; font-size: 13px;
    resize: none; box-sizing: border-box; transition: all 0.3s;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
  }
  textarea:focus { outline: none; border-color: var(--accent); color: var(--accent); }
  
  /* Nút bấm */
  .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
  
  .btn {
    padding: 12px 30px; font-size: 14px; font-weight: bold; text-transform: uppercase;
    border-radius: 8px; cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px;
  }
  
  .btn-obfuscate {
    background: rgba(0, 255, 204, 0.1); color: var(--accent);
    border: 1px solid var(--accent);
  }
  .btn-obfuscate:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }

  .btn-copy {
    background: rgba(0, 153, 255, 0.1); color: #0099ff;
    border: 1px solid #0099ff;
  }
  .btn-copy:hover { background: #0099ff; color: #fff; box-shadow: 0 0 20px #0099ff; }

  /* Thông báo Copy */
  #toast {
    position: absolute; top: 20px; right: 20px;
    background: var(--accent); color: #000; padding: 10px 20px;
    border-radius: 6px; font-weight: bold; font-size: 13px;
    opacity: 0; transform: translateY(-10px); transition: all 0.3s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div class="container">
  <div id="toast">Đã chép vào khay nhớ tạm!</div>
  
  <div class="header">
    <h1 class="title">SS2DEVHUB GENERATOR</h1>
    <div class="subtitle">Multi-Layer Obfuscator v10.0</div>
  </div>

  <div class="grid-layout">
    <div class="box-wrap">
      <div class="box-title">1. Code gốc (Raw Script)</div>
      <textarea id="raw-code" placeholder="Dán mã nguồn cần bảo vệ vào đây..."></textarea>
    </div>
    
    <div class="box-wrap">
      <div class="box-title">2. Code đã mã hóa (Obfuscated)</div>
      <textarea id="obf-code" readonly placeholder="Mã nguồn sau khi mã hóa sẽ hiển thị ở đây..."></textarea>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn btn-obfuscate" onclick="generateCode()">
      <span>🔒 Mã Hóa Ngay</span>
    </button>
    <button class="btn btn-copy" onclick="copyToClipboard()">
      <span>📋 Copy Code</span>
    </button>
  </div>
</div>

<script>
// Logic Mã Hóa & Xào Code
function generateCode() {
  const rawInput = document.getElementById('raw-code').value;
  const outputBox = document.getElementById('obf-code');
  
  if (!rawInput.trim()) {
    alert("Bạn chưa nhập code gốc!");
    return;
  }

  // Bước 1: Nén Base64 (Chống lỗi tiếng Việt & ký tự đặc biệt)
  const base64Payload = btoa(unescape(encodeURIComponent(rawInput)));

  // Bước 2: Bọc vào Lõi VM Control Flow Flattening (Bản không lỗi, không tự hủy)
  // Đây là chuỗi code ảo sẽ bọc lấy payload của bạn
  const vmTemplate = `(function(){
    var _0xMtx=['\\x61\\x74\\x6f\\x62','\\x65\\x76\\x61\\x6c'];
    function _0xMatrixVM(){
        var _0xFlow='3|0|1|4|2'['split']('|'),_0xStep=0;
        while(!![]){
            switch(_0xFlow[_0xStep++]){
                case '0':
                    setInterval(function(){try{Function('debugger')();}catch(e){}},1500);
                    continue;
                case '1':
                    var _0xSecureToken=0x99a;
                    continue;
                case '2':
                    return;
                case '3':
                    var _0xFakeEnv={version:10.0,author:'SS2DEVHUB'};
                    continue;
                case '4':
                    // WeAreDevs Unpacker Engine
                    var _0xPayload='${base64Payload}';
                    var _0xDecoded = decodeURIComponent(escape(window[_0xMtx[0]](_0xPayload)));
                    window[_0xMtx[1]](_0xDecoded);
                    continue;
            }
            break;
        }
    }
    _0xMatrixVM();
})();`;

  // Bước 3: Đẩy kết quả ra ô 2
  outputBox.value = vmTemplate;
}

// Logic Copy Code
function copyToClipboard() {
  const outputBox = document.getElementById('obf-code');
  if (!outputBox.value.trim()) {
    alert("Chưa có code mã hóa để copy!");
    return;
  }

  // Chọn và copy
  outputBox.select();
  outputBox.setSelectionRange(0, 999999); // Dành cho mobile
  document.execCommand("copy");

  // Hiển thị thông báo Toast
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 2000);
}
</script>
</body>
</html>
