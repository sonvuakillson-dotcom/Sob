<!DOCTYPE html>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {

    .container {

    h1 {

    textarea {

    textarea:focus {

    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }
    button {

    .status { font-size: 13px; color: #a0a0a0; min-height: 20px; }
    .footer { text-align: center; font-size: 11px; color: #5a6070; margin-top: 8px; }

</head>
<body>
<div class="container">
  <div class="ascii-logo">
<!--

██║       ╚██╔╝  ██║╚██╗██║    ██║   ██║██╔══██╗██╔══╝  ██║   ██║╚════██║██║     ██╔══██║   ██║   ██╔══╝

  <h1>🐾 LYN OBFUSCATE</h1>
  <textarea id="input" rows="12" placeholder="Paste your Lua code here..."></textarea>
  <div class="btn-group">
    <button id="obfuscateBtn">Obfuscate Code</button>
    <button id="copyBtn">Copy Output</button>
    <button id="clearBtn">Clear All</button>
  </div>
  <textarea id="output" rows="14" placeholder="Obfuscated code will appear here..." readonly></textarea>
  <div class="status" id="status">Ready. Your Lua code will be heavily armored.</div>
  <div class="footer">Lyn Obfuscate &copy; 2026 — Heavy Lua protection</div>
</div>

<script>
(function() {
  let nameCounter = 0;
  function freshName(prefix = 'lyn_') {
    return prefix + (++nameCounter).toString(36);
  }

  function generateRandomKey(length = 8) {
    const arr = new Uint8Array(length);
    window.crypto.getRandomValues(arr);
    return String.fromCharCode(...arr);
  }

  function xorBytes(str, key) {
    const out = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) {
      const b = str.charCodeAt(i) & 0xFF;
      const k = key.charCodeAt(i % key.length) & 0xFF;
      out[i] = b ^ k;
    }
    return out;
  }

  function bytesToLuaEscape(bytes) {
    return Array.from(bytes, b => '\\' + b.toString(10).padStart(3, '0')).join('');
  }

  class Scope {
    constructor(parent = null) {
      this.parent = parent;
      this.vars = new Map();
    }
    add(original, newName) { this.vars.set(original, newName); }
    lookup(name) {
      if (this.vars.has(name)) return this.vars.get(name);
      return this.parent ? this.parent.lookup(name) : null;
    }
  }

  function walkAST(node, parent, scope, replacements) {
    if (!node || typeof node !== 'object') return;
    if (node.type) {
      switch (node.type) {
        case 'LocalStatement': {
          if (node.variables) {
            node.variables.forEach(v => {
              if (v.type === 'Identifier') {
                const newName = freshName();
                scope.add(v.name, newName);
                replacements.push({ start: v.range[0], end: v.range[1], text: newName });
              }
            });
          }
          break;
        }
        case 'FunctionDeclaration': {
          if (node.isLocal && node.identifier && node.identifier.type === 'Identifier') {
            const newName = freshName();
            scope.add(node.identifier.name, newName);
            replacements.push({ start: node.identifier.range[0], end: node.identifier.range[1], text: newName });
          }
          const funcScope = new Scope(scope);
          if (node.parameters) {
            node.parameters.forEach(p => {
              if (p.type === 'Identifier') {
                const newName = freshName();
                funcScope.add(p.name, newName);
                replacements.push({ start: p.range[0], end: p.range[1], text: newName });
              }
            });
          }
          walkAST(node.body, node, funcScope, replacements);
          return;
        }
        case 'ForGeneric':
        case 'ForNumeric': {
          if (node.variables) {
            node.variables.forEach(v => {
              if (v.type === 'Identifier') {
                const newName = freshName();
                scope.add(v.name, newName);
                replacements.push({ start: v.range[0], end: v.range[1], text: newName });
              }
            });
          }
          const loopScope = new Scope(scope);
          if (node.variables) {
            node.variables.forEach(v => {
              if (v.type === 'Identifier') {
                const newName = scope.lookup(v.name);
                if (newName) loopScope.add(v.name, newName);
              }
            });
          }
          walkAST(node.body, node, loopScope, replacements);
          ['init', 'limit', 'step'].forEach(prop => {
            if (node[prop]) walkAST(node[prop], node, scope, replacements);
          });
          return;
        }
        case 'Identifier': {
          if (parent && parent.type === 'MemberExpression' && parent.indexer === '.' && parent.identifier === node) break;
          const newName = scope.lookup(node.name);
          if (newName) replacements.push({ start: node.range[0], end: node.range[1], text: newName });
          break;
        }
        case 'StringLiteral': {
          const key = generateRandomKey(6 + Math.floor(Math.random() * 8));
          const encryptedBytes = xorBytes(node.value, key);
          const encStr = bytesToLuaEscape(encryptedBytes);
          const keyStr = bytesToLuaEscape([...key].map(c => c.charCodeAt(0)));
          replacements.push({ start: node.range[0], end: node.range[1], text: `lyn_decrypt("${encStr}","${keyStr}")` });
          break;
        }
      }
    }
    for (const key in node) {
      if (key === 'parent' || key === 'range' || key === 'loc' || key === 'type') continue;
      const child = node[key];
      if (Array.isArray(child)) child.forEach(c => walkAST(c, node, scope, replacements));
      else if (child && typeof child === 'object' && child.type) walkAST(child, node, scope, replacements);
    }
  }

  function generateJunkLines(count = 3) {
    const junk = [];
    for (let i = 0; i < count; i++) {
      const r = Math.random();
      if (r < 0.3) {
        const v = freshName('j_');
        junk.push(`local ${v} = (${Math.floor(Math.random()*1000)} + ${Math.floor(Math.random()*500)}) / 2;`);
      } else if (r < 0.6) {
        junk.push(`if (0x${Math.floor(Math.random()*0xFF).toString(16)} > ${Math.floor(Math.random()*50)}) then end`);
      } else {
        junk.push(`task.wait(${(0.05 + Math.random()*0.2).toFixed(2)})`);
      }
    }
    return junk.join('\n');
  }

  function obfuscateLuaCode(code) {
    if (!code.trim()) throw new Error('No code provided');
    let ast;
    try {
      ast = luaparse.parse(code, { wait: false, locations: true, ranges: true, scope: false });
    } catch (e) {
      throw new Error('Parse error: ' + e.message);
    }
    nameCounter = 0;
    const replacements = [];
    const globalScope = new Scope();
    walkAST(ast, null, globalScope, replacements);
    replacements.sort((a, b) => b.start - a.start);
    let obfCode = code;
    for (const rep of replacements) {
      obfCode = obfCode.slice(0, rep.start) + rep.text + obfCode.slice(rep.end);
    }
    const dNames = {
      char: freshName('_d'), byte: freshName('_d'), sub: freshName('_d'),
      bit: freshName('_d'), bxor: freshName('_d'), concat: freshName('_d'), insert: freshName('_d')
    };
    const header = `
-- Lyn Obfuscate (heavy Lua armor)
local ${dNames.char} = string.char;
local ${dNames.byte} = string.byte;
local ${dNames.sub} = string.sub;
local ${dNames.bit} = bit32 or bit;
local ${dNames.bxor} = ${dNames.bit}.bxor;
local ${dNames.concat} = table.concat;
local ${dNames.insert} = table.insert;

local function lyn_decrypt(data, key)
  local result = {};
  for i = 1, #data do
    ${dNames.insert}(result, ${dNames.char}(${dNames.bxor}(${dNames.byte}(${dNames.sub}(data, i, i)), ${dNames.byte}(${dNames.sub}(key, 1 + (i % #key), 1 + (i % #key)))) % 256));
  end
  return ${dNames.concat}(result);
end

-- Junk start
${generateJunkLines(4)}
-- End junk
`;
    const footer = `
-- Junk end
${generateJunkLines(2)}
`;
    return header + obfCode + footer;
  }

  const inputEl = document.getElementById('input');
  const outputEl = document.getElementById('output');
  const statusEl = document.getElementById('status');
  document.getElementById('obfuscateBtn').addEventListener('click', () => {
    try {
      const original = inputEl.value;
      if (!original.trim()) { statusEl.textContent = 'Please paste some Lua code.'; return; }
      statusEl.textContent = 'Obfuscating...';
      outputEl.value = obfuscateLuaCode(original);
      statusEl.textContent = 'Obfuscation complete. Code is heavily armored.';
    } catch (err) {
      statusEl.textContent = 'Error: ' + err.message;
      outputEl.value = '';
    }
  });
  document.getElementById('copyBtn').addEventListener('click', () => {
    const text = outputEl.value;
    if (!text) { statusEl.textContent = 'Nothing to copy.'; return; }
    navigator.clipboard.writeText(text).then(() => statusEl.textContent = 'Copied!').catch(() => statusEl.textContent = 'Copy failed');
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    inputEl.value = ''; outputEl.value = ''; statusEl.textContent = 'Cleared.';
  });
  if (!inputEl.value) {
    inputEl.value = `-- example Lua code
local function greet(name)
  print("Hello, " .. name)
end
greet("World")`;
  }
})();
</script>
