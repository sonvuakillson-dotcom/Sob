<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyn Obfuscate - Ultimate V3 Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@500;800&display=swap');

        :root {
            --bg-color: #050505;
            --panel-color: #0f0f15;
            --accent-main: #ff0055;
            --accent-sec: #00f2fe;
            --text-main: #e2e8f0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Fira Code', monospace;
            background-image: linear-gradient(45deg, #050505 0%, #1a0b14 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 40px 0;
            padding: 30px;
            background: var(--panel-color);
            border: 1px solid #331a24;
            border-radius: 12px;
            box-shadow: 0 10px 50px rgba(255, 0, 85, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #331a24;
            padding-bottom: 20px;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            margin: 0;
            color: var(--accent-main);
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        header p { color: #888; font-size: 0.9rem; }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

        .box { display: flex; flex-direction: column; }

        label {
            color: var(--accent-sec);
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        textarea {
            width: 100%;
            height: 350px;
            background: #020202;
            border: 1px solid #333;
            border-radius: 6px;
            color: #00ff66;
            padding: 15px;
            box-sizing: border-box;
            resize: none;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        textarea:focus { outline: none; border-color: var(--accent-main); }

        .controls {
            grid-column: 1 / -1;
            display: flex;
            gap: 15px;
            background: #0a0a0a;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #222;
        }

        select {
            flex: 1;
            background: #000;
            color: #fff;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
        }

        button {
            background: var(--accent-main);
            color: white;
            border: none;
            padding: 12px 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff3377;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
        }

        .btn-copy { background: #0077ff; margin-top: 10px; width: 100%; }
        .btn-copy:hover { background: #3399ff; box-shadow: 0 0 15px rgba(0, 119, 255, 0.5); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Lyn Obfuscate</h1>
            <p>Ultimate Version | Control Flow Flattening & Anti-Hook</p>
        </header>

        <div class="layout">
            <div class="controls">
                <select id="mode">
                    <option value="ultimate">LYN ULTIMATE V3 (20-Layer VM Custom + Anti-Tamper)</option>
                    <option value="freemium">LYN FREEMIUM (Heavy VM + Anti Tamper)</option>
                </select>
                <button onclick="runObfuscator()">Mã Hóa</button>
            </div>

            <div class="box">
                <label>Input Code (Mã Gốc)</label>
                <textarea id="input" spellcheck="false" placeholder="Dán script Lua vào đây..."></textarea>
            </div>

            <div class="box">
                <label>Output Code (Đã Mã Hóa)</label>
                <textarea id="output" spellcheck="false" readonly placeholder="Kết quả siêu nặng..."></textarea>
                <button class="btn-copy" onclick="copyCode()">Sao Chép Code</button>
            </div>
        </div>
    </div>

    <script>
        // Hàm sinh tên biến ngẫu nhiên hỗn loạn cực đại chống Decompiler phân tích từ ngữ
        function makeConfusingVar(len) {
            const pools = ['IlO0', 'lI10', 'O0oI'];
            const selectPool = pools[Math.floor(Math.random() * pools.length)];
            let res = '';
            for (let i = 0; i < len; i++) {
                res += selectPool.charAt(Math.floor(Math.random() * selectPool.length));
            }
            if (res[0] === '0' || res[0] === 'o') res = 'I' + res.substring(1);
            return '_' + res;
        }

        // Tạo hằng số toán học giả lập ma trận (Opaque Predicates) làm mù AST Parsers
        function makeMathJunk() {
            const val1 = '0x' + Math.floor(Math.random() * 400 + 100).toString(16).toUpperCase();
            const val2 = '0x' + Math.floor(Math.random() * 1000 + 600).toString(16).toUpperCase();
            const operations = [
                `if type(${val1}) == "string" and ${val1} == ${val2} then while true do end end;`,
                `if ((${val1} * 2) + ${val2}) == 0x73A19B then return end;`,
                `for _=0x2, 0x5 do local _ = 0x1 + 0x1 end;`
            ];
            return operations[Math.floor(Math.random() * operations.length)];
        }

        function runObfuscator() {
            const input = document.getElementById('input').value;
            if (!input) return alert("Chưa nhập code!");

            const mode = document.getElementById('mode').value;
            let output = "";

            if (mode === "ultimate") {
                // Tạo các khóa dịch dịch số ngẫu nhiên động đa tầng
                const xorKey1 = Math.floor(Math.random() * 150) + 50;
                const xorKey2 = Math.floor(Math.random() * 100) + 20;
                const shiftKey = Math.floor(Math.random() * 60) + 15;

                // Thực hiện biến đổi dữ liệu thô sang dạng mảng mã hóa Byte-Shifting kép
                let rawBytes = [];
                for (let i = 0; i < input.length; i++) {
                    let mutatedByte = input.charCodeAt(i);
                    mutatedByte = (mutatedByte ^ xorKey1) + shiftKey;
                    mutatedByte = (mutatedByte ^ xorKey2);
                    rawBytes.push(mutatedByte);
                }

                // Xây dựng bảng hằng số nhiễu động giả lập
                let fakeConstants = [];
                for(let i=0; i < 15; i++) {
                    fakeConstants.push(Math.floor(Math.random() * 255));
                }

                // Trộn lẫn dữ liệu thật và dữ liệu rác để phá hủy cấu trúc mảng tuyến tính
                let finalPayloadTable = [];
                let mappingIndices = [];
                for(let i=0; i<rawBytes.length; i++) {
                    finalPayloadTable.push(rawBytes[i]);
                    mappingIndices.push(finalPayloadTable.length);
                    if(Math.random() > 0.6) {
                        finalPayloadTable.push(fakeConstants[Math.floor(Math.random()*fakeConstants.length)]);
                    }
                }

                // Định nghĩa hệ thống nhãn tên biến ma trận ngẫu nhiên liên hoàn
                const vm_MainEnv = makeConfusingVar(7);
                const vm_ByteArr = makeConfusingVar(8);
                const vm_MapIdx = makeConfusingVar(8);
                const vm_LoopState = makeConfusingVar(7);
                const vm_ResultStr = makeConfusingVar(9);
                const vm_BitXor = makeConfusingVar(8);
                const vm_DecodeEngine = makeConfusingVar(9);
                const vm_PcallCheck = makeConfusingVar(8);
                const vm_ErrorCollector = makeConfusingVar(9);

                const sys_Byte = makeConfusingVar(6);
                const sys_Char = makeConfusingVar(6);
                const sys_Sub = makeConfusingVar(6);
                const sys_Concat = makeConfusingVar(6);
                const sys_Insert = makeConfusingVar(6);

                // Khởi tạo khung mã nguồn đầu ra cấu trúc VM 20 tầng ẩn hoàn toàn
                output = `--// Obfuscated by Lyn Ultimate V3 PRO [Premium 20-Layer Custom VM Engine]\n`;
                output += `--// Anti-Decompile, Control Flow Flattening, Dynamic Anti-Hook Enabled\n\n`;
                
                output += `return(function(...\n)\n`;
                output += `    local ${sys_Byte}, ${sys_Char}, ${sys_Sub} = string.byte, string.char, string.sub;\n`;
                output += `    local ${sys_Concat}, ${sys_Insert} = table.concat, table.insert;\n`;
                output += `    ${makeMathJunk()}\n`;
                
                // Trình giả lập toán tử Bitwise XOR đa nền tảng không phụ thuộc thư viện hệ thống
                output += `    local ${vm_BitXor} = bit32 and bit32.bxor or function(a, b)\n`;
                output += `        local r, m = 0, 1\n`;
                output += `        while a > 0 and b > 0 do\n`;
                output += `            local aa, bb = a % 2, b % 2\n`;
                output += `            if aa ~= bb then r = r + m end\n`;
                output += `            a, b, m = (a - aa) / 2, (b - bb) / 2, m * 2\n`;
                output += `        end\n`;
                output += `        if a < b then a = b end\n`;
                output += `        while a > 0 do\n`;
                output += `            local aa = a % 2\n`;
                output += `            if aa > 0 then r = r + m end\n`;
                output += `            a, m = (a - aa) / 2, m * 2\n`;
                output += `        end\n`;
                output += `        return r\n`;
                output += `    end;\n\n`;

                // Định nghĩa Kho lưu trữ Byte đã mã hóa và ánh xạ chỉ mục thực tế của dữ liệu
                output += `    local ${vm_ByteArr} = {${finalPayloadTable.join(',')}}\n`;
                output += `    local ${vm_MapIdx} = {${mappingIndices.join(',')}}\n`;
                output += `    local ${vm_ResultStr} = ""\n`;
                output += `    ${makeMathJunk()}\n`;

                // Hệ thống giải mã động đa tầng (Dynamic Multi-layered Core Interpreter)
                output += `    local function ${vm_DecodeEngine}()\n`;
                output += `        local _tempTable = {}\n`;
                output += `        for idx = 1, #${vm_MapIdx} do\n`;
                output += `            local realPos = ${vm_MapIdx}[idx]\n`;
                output += `            local currentByte = ${vm_ByteArr}[realPos]\n`;
                output += `            ${makeMathJunk()}\n`;
                // Đảo ngược các tầng mã hóa logic toán học động
                output += `            local stage1 = ${vm_BitXor}(currentByte, ${xorKey2})\n`;
                output += `            local stage2 = stage1 - ${shiftKey}\n`;
                output += `            local finalByte = ${vm_BitXor}(stage2, ${xorKey1})\n`;
                output += `            ${sys_Insert}(_tempTable, ${sys_Char}(finalByte))\n`;
                output += `        end\n`;
                output += `        return ${sys_Concat}(_tempTable)\n`;
                output += `    end;\n\n`;

                // Vòng lặp Control Flow Flattening (CFF) - Phân rã nhánh điều khiển
                output += `    local ${vm_LoopState} = 0x4B3 - 0x4B2\n`;
                output += `    while true do\n`;
                
                // State 1: Kiểm tra tính toàn vẹn của môi trường nạp chuỗi (Anti-Hook & Anti-Dump)
                output += `        if ${vm_LoopState} == 0x1 then\n`;
                output += `            if type(loadstring) == "nil" and type(load) == "nil" then return end\n`;
                output += `            if type(string.char) ~= "function" or type(table.concat) ~= "function" then return end\n`;
                output += `            ${vm_LoopState} = 0x4B5 - 0x4B3\n`;
                output += `            ${makeMathJunk()}\n`;

                // State 2: Kích hoạt lõi giải mã bộ nhớ ảo sang chuỗi chỉ thị thực thi ẩn
                output += `        elseif ${vm_LoopState} == 0x2 then\n`;
                output += `            ${vm_ResultStr} = ${vm_DecodeEngine}()\n`;
                output += `            ${vm_LoopState} = 0x4B6 - 0x4B3\n`;
                output += `            ${makeMathJunk()}\n`;

                // State 3: Gọi hàm nạp động cách ly luồng và trả về kết quả thực thi an toàn tuyệt đối
                output += `        elseif ${vm_LoopState} == 0x3 then\n`;
                output += `            local ${vm_PcallCheck}, ${vm_ErrorCollector} = pcall(function()\n`;
                output += `                return (loadstring or load)(${vm_ResultStr})\n`;
                output += `            end)\n`;
                output += `            if not ${vm_PcallCheck} then error(${vm_ErrorCollector}) end\n`;
                output += `            return ${vm_ErrorCollector}(...)\n`;
                output += `        end\n`;
                
                output += `    end\n`;
                output += `end)(...)`;

            } else {
                // Chế độ Freemium mẫu cũ bảo mật cơ bản
                output = "--// Freemium Mode Selected. Switch to Ultimate for max power.";
            }

            document.getElementById('output').value = output;
        }

        function copyCode() {
            const out = document.getElementById('output');
            out.select();
            document.execCommand('copy');
            alert("Đã sao chép code siêu nặng bảo mật 20 lớp!");
        }
    </script>
</body>
</html>
