<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyn AI - Vietsub Tiếng Trung Chuyên Nghiệp (Groq Engine Pro)</title>
    <style>
        /* ==========================================================================
           1. CẤU HÌNH GIAO DIỆN CHUẨN DARK MODE & CINEMATIC UI
           ========================================================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0d0d0d; color: #e5e5e5; padding: 30px; line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        header { margin-bottom: 25px; text-align: center; }
        header h1 { color: #00ff88; font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; text-transform: uppercase; text-shadow: 0 0 10px rgba(0,255,136,0.2); }
        header p { color: #888; font-size: 0.95rem; }

        /* Khung điều khiển và cấu hình nhập liệu */
        .control-panel { background: #161616; border: 1px solid #262626; border-radius: 14px; padding: 25px; margin-bottom: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #00ff88; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        .input-group input[type="text"] { width: 100%; background: #222; border: 1px solid #333; padding: 12px; border-radius: 8px; color: #fff; font-family: monospace; font-size: 0.95rem; transition: all 0.3s ease; }
        .input-group input[type="text"]:focus { border-color: #00ff88; outline: none; box-shadow: 0 0 8px rgba(0,255,136,0.15); }
        
        /* Vùng thả/chọn File Video */
        .upload-zone { border: 2px dashed #333; padding: 30px; border-radius: 10px; background: #1a1a1a; cursor: pointer; text-align: center; transition: all 0.3s ease; margin-bottom: 15px; }
        .upload-zone:hover { border-color: #00ff88; background: #1e1e1e; }
        .upload-zone input[type="file"] { display: none; }
        .upload-zone p { color: #aaa; font-size: 1rem; }
        .file-info { margin-top: 10px; font-size: 0.85rem; color: #00ff88; display: none; font-weight: 500; }

        /* Nút kích hoạt hệ thống */
        .btn-submit { width: 100%; background: #00ff88; color: #050505; font-size: 1.05rem; font-weight: 700; border: none; padding: 15px; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s ease; }
        .btn-submit:hover { background: #00cc6a; transform: translateY(-1px); box-shadow: 0 5px 15px rgba(0,255,136,0.3); }
        .btn-submit:disabled { background: #222; color: #555; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Bảng hiển thị tiến trình trạng thái và Tự vá lỗi (Console Log) */
        .console-box { background: #050505; border: 1px solid #1a1a1a; border-radius: 8px; padding: 15px; margin-bottom: 25px; text-align: left; max-height: 150px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 0.85rem; }
        .log-item { margin-bottom: 4px; color: #aaa; }
        .log-item.info { color: #00bfff; }
        .log-item.success { color: #00ff88; }
        .log-item.warn { color: #ffcc00; }
        .log-item.error { color: #ff3333; }

        /* ==========================================================================
           2. KHUNG TRÌNH CHIẾU VIDEO & PHỤ ĐỀ ĐÈ ĐỘC QUYỀN
           ========================================================================== */
        .video-wrapper { position: relative; width: 100%; background: #000; border-radius: 14px; overflow: hidden; box-shadow: 0 12px 36px rgba(0,0,0,0.6); border: 1px solid #222; display: none; }
        video { width: 100%; display: block; }
        
        /* Lớp phủ phụ đề chữ Việt đè lên chữ Trung chuẩn điện ảnh */
        .subtitle-overlay { position: absolute; bottom: 7%; left: 50%; transform: translateX(-50%); width: 85%; text-align: center; pointer-events: none; user-select: none; z-index: 999; display: none; }
        .subtitle-text { inline-size: 100%; display: inline-block; background: rgba(0, 0, 0, 0.82); color: #ffffff; padding: 8px 20px; border-radius: 8px; font-size: 24px; font-weight: 700; line-height: 1.4; white-space: pre-line; word-wrap: break-word; /* Tạo viền đen bao quanh chữ tăng tương phản tối đa */ text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0px 3px 5px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎙️ Lyn AI - Vietsub Tiếng Trung Cao Cấp</h1>
        <p>Bản sửa lỗi Groq API tối thượng - Chỉ đè phụ đề chữ Việt lên video gốc</p>
    </header>

    <div class="control-panel">
        <div class="input-group">
            <label for="apiKey">Cấu hình Groq Cloud API Key:</label>
            <input type="text" id="apiKey" value="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" placeholder="Nhập gsk_...">
        </div>
        
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <p>Nhấp vào đây hoặc kéo thả file Video tiếng Trung vào vùng này</p>
            <input type="file" id="fileInput" accept="video/*, audio/*" onchange="handleFileSelect(event)">
            <div id="fileInfo" class="file-info"></div>
        </div>

        <button id="submitBtn" class="btn-submit" onclick="startSubtitlingEngine()">🚀 Xử Lý Vietsub Ngay</button>
    </div>

    <div class="console-box" id="consoleBox">
        <div class="log-item info">[Hệ thống] Sẵn sàng nhận tệp dữ liệu đầu vào...</div>
    </div>

    <div class="video-wrapper" id="videoWrapper">
        <video id="videoPlayer" controls crossorigin="anonymous"></video>
        <div class="subtitle-overlay" id="subOverlay">
            <span class="subtitle-text" id="subText"></span>
        </div>
    </div>
</div>

<script>
    /* ==========================================================================
       3. ENGINE LÕI - QUẢN LÝ BIẾN TOÀN CỤC & GIÁM SÁT LOGS
       ========================================================================== */
    let globalSubtitles = []; // Mảng chứa dữ liệu mốc thời gian và text vietsub chuẩn hóa
    const consoleBox = document.getElementById('consoleBox');

    function writeLog(text, type = 'info') {
        const item = document.createElement('div');
        item.className = `log-item ${type}`;
        const time = new Date().toLocaleTimeString();
        item.innerText = `[${time}] ${text}`;
        consoleBox.appendChild(item);
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            const sizeInMB = (file.size / (1024 * 1024)).toFixed(2);
            const fileInfo = document.getElementById('fileInfo');
            fileInfo.innerText = `📁 Đã chọn: ${file.name} (${sizeInMB} MB)`;
            fileInfo.style.display = 'block';
            writeLog(`Đã tải file thành công: ${file.name}`, 'success');
        }
    }

    /* ==========================================================================
       4. MODULE XỬ LÝ ÂM THANH - TRÍCH XUẤT VÀ NÉN AUDIO ĐỂ BYPASS LIMIT 25MB
       ========================================================================== */
    async function extractAndDownsampleAudio(file) {
        writeLog("Bắt đầu khởi tạo bộ giải mã âm thanh Web Audio API...", 'info');
        const arrayBuffer = await file.arrayBuffer();
        
        // Hạ tần số lấy mẫu xuống 16000Hz (Tiêu chuẩn vàng giúp Whisper nhận diện tốt nhất và nhẹ nhất)
        const targetSampleRate = 16000;
        const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: targetSampleRate });
        
        writeLog("Đang giải mã luồng dữ liệu nhị phân từ video đầu vào...", 'info');
        let decodedBuffer;
        try {
            decodedBuffer = await audioContext.decodeAudioData(arrayBuffer);
        } catch (e) {
            throw new Error("Không thể giải mã dữ liệu âm thanh của file này. Định dạng video không được hỗ trợ.");
        }

        writeLog("Đang ép luồng âm thanh Stereo về Mono (1 kênh) để giảm dung lượng file xuống 50%...", 'info');
        const offlineContext = new OfflineAudioContext(1, decodedBuffer.length, targetSampleRate);
        const bufferSource = offlineContext.createBufferSource();
        bufferSource.buffer = decodedBuffer;
        bufferSource.connect(offlineContext.destination);
        bufferSource.start();

        const renderedBuffer = await offlineContext.startRendering();
        return encodeAudioBufferToWav(renderedBuffer);
    }

    // Hàm chuyển đổi cấu trúc AudioBuffer thành định dạng tệp WAV nguyên bản (PCM 16-bit)
    function encodeAudioBufferToWav(buffer) {
        const length = buffer.length * 2 + 44;
        const bufferArray = new ArrayBuffer(length);
        const view = new DataView(bufferArray);
        let pos = 0;

        const writeString = (str) => { for (let i = 0; i < str.length; i++) { view.setUint8(pos + i, str.charCodeAt(i)); } pos += str.length; };
        const writeUint32 = (val) => { view.setUint32(pos, val, true); pos += 4; };
        const writeUint16 = (val) => { view.setUint16(pos, val, true); pos += 2; };

        writeString('RIFF');
        writeUint32(length - 8);
        writeString('WAVE');
        writeString('fmt ');
        writeUint32(16);
        writeUint16(1); // Định dạng PCM mã hóa tuyến tính
        writeUint16(1); // Kênh Mono đơn lẻ
        writeUint32(buffer.sampleRate);
        writeUint32(buffer.sampleRate * 2);
        writeUint16(2);
        writeUint16(16); // 16 bits per sample
        writeString('data');
        writeUint32(length - pos - 4);

        const channelData = buffer.getChannelData(0);
        for (let i = 0; i < channelData.length; i++) {
            let sample = Math.max(-1, Math.min(1, channelData[i]));
            // Chuyển đổi biên độ dấu phẩy động sang số nguyên short 16-bit kí tự
            view.setInt16(pos, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
            pos += 2;
        }
        return new Blob([bufferArray], { type: 'audio/wav' });
    }

    /* ==========================================================================
       5. HOẠT ĐỘNG CỦA MÁY CHỦ GROQ API - BÓC BĂNG & DỊCH THUẬT PHỤ ĐỀ CHUẨN JSON
       ========================================================================== */
    async function startSubtitlingEngine() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const fileInput = document.getElementById('fileInput');
        const submitBtn = document.getElementById('submitBtn');
        const videoPlayer = document.getElementById('videoPlayer');
        const videoWrapper = document.getElementById('videoWrapper');

        if (!apiKey) return alert("Vui lòng nhập mã cấu hình Groq API Key trước!");
        if (fileInput.files.length === 0) return alert("Vui lòng chọn một tệp video tiếng Trung!");

        // Khóa giao diện điều hướng, tránh việc người dùng nhấn lặp lại gây crash luồng request
        submitBtn.disabled = true;
        globalSubtitles = [];
        document.getElementById('subOverlay').style.display = 'none';

        const file = fileInput.files[0];
        videoPlayer.src = URL.createObjectURL(file);
        videoWrapper.style.display = 'block';

        try {
            // Bước 1: Trích tách và thu gọn dung lượng âm thanh gốc
            const compressedWavBlob = await extractAndDownsampleAudio(file);
            writeLog(`Nén âm thanh hoàn tất! Kích thước file xử lý: ${(compressedWavBlob.size / (1024*1024)).toFixed(2)} MB`, 'success');

            if (compressedWavBlob.size > 25 * 1024 * 1024) {
                throw new Error("Dung lượng âm thanh sau nén vẫn vượt ngưỡng 25MB của Groq. Vui lòng cắt ngắn phim dưới 15 phút.");
            }

            // Bước 2: Truy vấn cổng Groq Whisper bằng phương thức verbose_json để thu thập mốc thời gian câu thoại
            writeLog("Đang đẩy file âm thanh lên Groq Whisper AI nhận diện tiếng Trung...", 'info');
            const whisperFormData = new FormData();
            whisperFormData.append("file", compressedWavBlob, "audio.wav");
            whisperFormData.append("model", "whisper-large-v3");
            whisperFormData.append("response_format", "verbose_json"); // ĐÃ FIX TRIỆT ĐỂ LỖI ĐỊNH DẠNG TẠI ĐÂY
            whisperFormData.append("language", "zh"); // Thiết lập nhận diện ngôn ngữ đích là tiếng Trung Quốc

            const whisperResponse = await fetch("[https://api.groq.com/openai/v1/audio/transcriptions](https://api.groq.com/openai/v1/audio/transcriptions)", {
                method: "POST",
                headers: { "Authorization": `Bearer ${apiKey}` },
                body: whisperFormData
            });

            if (!whisperResponse.ok) {
                const errorData = await whisperResponse.text();
                throw new Error(`Groq Whisper từ chối dịch vụ: ${errorData}`);
            }

            const whisperData = await whisperResponse.json();
            if (!whisperData.segments || whisperData.segments.length === 0) {
                throw new Error("Whisper không thể phát hiện lời thoại tiếng Trung nào trong tệp này.");
            }

            writeLog(`Bóc băng thành công! Phát hiện ${whisperData.segments.length} phân đoạn lời thoại tiếng Trung.`, 'success');

            // Bước 3: Đóng gói các dòng hội thoại thô dạng tối giản cấu trúc để tiết kiệm Token gửi lên Llama dịch thuật
            writeLog("Đang đóng gói cấu trúc dữ liệu gửi qua mô hình Llama 3.3 dịch nghĩa sang tiếng Việt...", 'info');
            const standardPayload = whisperData.segments.map((seg, i) => ({ id: i, t: seg.text }));

            // Hệ thống Prompt kỹ thuật quy định cấu trúc trả về bắt buộc
            const systemInstructions = "You are an expert translator. Translate the Chinese text segments in the provided JSON array into natural, high-quality, and idiomatic Vietnamese subtitles suitable for cinema. " +
                                        "CRITICAL REQUIREMENT: You must maintain the exact same JSON array structure. Your output response must be a strict JSON object containing a 'translations' key mapping to the array of translated items. " +
                                        "Example output format: {\"translations\": [{\"id\": 0, \"t\": \"Lời dịch Tiếng Việt\"}]}. " +
                                        "Do not add any preamble, conversational phrases, markdown code blocks (like ```json), or notes. Return only the raw JSON string.";

            const llamaResponse = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: systemInstructions },
                        { role: "user", content: JSON.stringify({ data: standardPayload }) }
                    ],
                    temperature: 0.1, // Ép nhiệt độ tư duy thấp nhất để tránh AI tự biên tự diễn sai lệch nghĩa
                    response_format: { type: "json_object" } // BẮT BUỘC ÉP KHUÔN ĐẦU RA LÀ JSON SẠCH
                })
            });

            if (!llamaResponse.ok) {
                const errorData = await llamaResponse.text();
                throw new Error(`Bộ não dịch thuật Llama báo lỗi: ${errorData}`);
            }

            const llamaData = await llamaResponse.json();
            const rawTranslationString = llamaData.choices[0].message.content.trim();

            // Bước 4: Chạy cơ chế giải mã phụ đề tích hợp tự sửa lỗi cấu trúc văn bản (Self-Healing Framework)
            processAndRealignSubtitles(whisperData.segments, rawTranslationString);

        } catch (error) {
            writeLog(`[CRASH] Trục trặc hệ thống: ${error.message}`, 'error');
            alert("Quá trình xử lý thất bại! Hãy kiểm tra nội dung log lỗi trong bảng điều khiển console phía dưới.");
        } finally {
            submitBtn.disabled = false;
        }
    }

    /* ==========================================================================
       6. CƠ CHẾ KHẮC PHỤC LỖI (SELF-HEALING) & ĐỒNG BỘ MỐC THỜI GIAN PHỤ ĐỀ
       ========================================================================== */
    function processAndRealignSubtitles(originalSegments, translationString) {
        writeLog("Đang đồng bộ hóa luồng văn bản dịch thuật và mốc thời gian...", 'info');
        let parsedTranslations = [];

        try {
            // Thử nghiệm bóc tách chính quy JSON chuẩn của hệ thống
            const cleanJson = JSON.parse(translationString);
            parsedTranslations = cleanJson.translations || cleanJson.data || [];
        } catch (jsonErr) {
            writeLog("Cấu trúc JSON từ AI có dấu hiệu lệch chuẩn. Đang kích hoạt cơ chế tự vá lỗi bằng biểu thức chính quy (Regex Framework)...", 'warn');
            
            // Giải thuật cứu nguy tự động: Cố gắng quét tìm tất cả các cặp id và text dịch bằng cấu trúc chuỗi thủ công
            const regexMatcher = /"id"\s*:\s*(\d+)\s*,\s*"t"\s*:\s*"([^"]+)"/g;
            let match;
            while ((match = regexMatcher.exec(translationString)) !== null) {
                parsedTranslations.push({ id: parseInt(match[1]), t: match[2] });
            }
        }

        // Tạo ánh xạ dữ liệu nhanh bằng Map Object nhằm tăng tốc độ truy vết phần tử
        const translationMap = new Map();
        if (Array.isArray(parsedTranslations)) {
            parsedTranslations.forEach(item => {
                if (item && item.id !== undefined) translationMap.set(item.id, item.t);
            });
        }

        // Tái tổ hợp dữ liệu thô và dữ liệu dịch nghĩa để đưa vào hàng đợi trình phát
        originalSegments.forEach((seg, index) => {
            const vietnameseText = translationMap.get(index) || "---"; // Cơ chế Fallback dự phòng chống mất phân đoạn
            globalSubtitles.push({
                start: seg.start,
                end: seg.end,
                text: vietnameseText
            });
        });

        if (globalSubtitles.length > 0) {
            writeLog("Hệ thống đồng bộ hóa hoàn tất! Phụ đề chữ Việt sẵn sàng kích hoạt.", 'success');
            initCinematicSubtitlePlayer();
        } else {
            throw new Error("Không thể liên kết dữ liệu thời gian với nội dung chữ dịch thuật.");
        }
    }

    /* ==========================================================================
       7. ĐỘNG CƠ ĐÈ CHỮ PHỤ ĐỀ TRÊN KHUNG HÌNH (TIME-UPDATE TRACKING ENGINE)
       ========================================================================== */
    function initCinematicSubtitlePlayer() {
        const video = document.getElementById('videoPlayer');
        const overlay = document.getElementById('subOverlay');
        const textContainer = document.getElementById('subText');
        
        let lastActiveCue = null;

        // Cơ chế lắng nghe sự thay đổi khung hình chính xác đến từng mili-giây của trình duyệt
        video.addEventListener('timeupdate', () => {
            const currentTime = video.currentTime;
            
            // Tìm kiếm phân đoạn phụ đề khớp với mốc thời gian phát hiện tại
            const activeCue = globalSubtitles.find(cue => currentTime >= cue.start && currentTime <= cue.end);

            if (activeCue) {
                if (lastActiveCue !== activeCue) {
                    lastActiveCue = activeCue;
                    textContainer.innerText = activeCue.text;
                    overlay.style.display = 'block'; // Hiển thị đè chữ Việt lên màn hình phim
                }
            } else {
                lastActiveCue = null;
                overlay.style.display = 'none'; // Ẩn vùng hiển thị khi không có lời thoại tiếng Trung
            }
        });

        // Tự động ẩn phụ đề nếu người dùng tua video bừa bãi tránh hiện tượng đọng chữ cũ
        video.addEventListener('seeking', () => {
            lastActiveCue = null;
            overlay.style.display = 'none';
        });
    }
</script>

</body>
</html>
