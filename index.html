<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyn Obfuscate - Ultimate V3 Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@500;800&display=swap');

        :root {
            --bg-color: #050505;
            --panel-color: #0f0f15;
            --accent-main: #ff0055;
            --accent-sec: #00f2fe;
            --text-main: #e2e8f0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Fira Code', monospace;
            background-image: linear-gradient(45deg, #050505 0%, #1a0b14 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 40px 0;
            padding: 30px;
            background: var(--panel-color);
            border: 1px solid #331a24;
            border-radius: 12px;
            box-shadow: 0 10px 50px rgba(255, 0, 85, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #331a24;
            padding-bottom: 20px;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            margin: 0;
            color: var(--accent-main);
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        header p { color: #888; font-size: 0.9rem; }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

        .box { display: flex; flex-direction: column; }

        label {
            color: var(--accent-sec);
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        textarea {
            width: 100%;
            height: 350px;
            background: #020202;
            border: 1px solid #333;
            border-radius: 6px;
            color: #00ff66;
            padding: 15px;
            box-sizing: border-box;
            resize: none;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        textarea:focus { outline: none; border-color: var(--accent-main); }

        .controls {
            grid-column: 1 / -1;
            display: flex;
            gap: 15px;
            background: #0a0a0a;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #222;
        }

        select {
            flex: 1;
            background: #000;
            color: #fff;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
        }

        button {
            background: var(--accent-main);
            color: white;
            border: none;
            padding: 12px 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff3377;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
        }

        .btn-copy { background: #0077ff; margin-top: 10px; width: 100%; }
        .btn-copy:hover { background: #3399ff; box-shadow: 0 0 15px rgba(0, 119, 255, 0.5); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Lyn Obfuscate</h1>
            <p>Ultimate Version | Control Flow Flattening & Anti-Hook</p>
        </header>

        <div class="layout">
            <div class="controls">
                <select id="mode">
                    <option value="ultimate">LYN ULTIMATE V3 (CFF + Anti-Hook + Heavy Math)</option>
                    <option value="freemium">LYN FREEMIUM (Heavy VM + Anti Tamper)</option>
                </select>
                <button onclick="runObfuscator()">Mã Hóa</button>
            </div>

            <div class="box">
                <label>Input Code (Mã Gốc)</label>
                <textarea id="input" spellcheck="false" placeholder="Dán script Lua vào đây..."></textarea>
            </div>

            <div class="box">
                <label>Output Code (Đã Mã Hóa)</label>
                <textarea id="output" spellcheck="false" readonly placeholder="Kết quả siêu nặng..."></textarea>
                <button class="btn-copy" onclick="copyCode()">Sao Chép Code</button>
            </div>
        </div>
    </div>

    <script>
        // Sinh tên biến ngẫu nhiên dạng chuỗi khó đọc nhằm chống dịch ngược thủ công
        function generateConfusingName(length) {
            const chars = 'IlO0';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return (result[0] === '0' || result[0] === 'O') ? 'I' + result.substring(1) : result;
        }

        // Tạo các biểu thức toán học rác (Opaque Predicates) để đánh lừa Decompiler
        function generateOpaquePredicate() {
            const hex1 = '0x' + Math.floor(Math.random() * 200).toString(16).toUpperCase();
            const hex2 = '0x' + (Math.floor(Math.random() * 500) + 300).toString(16).toUpperCase();
            return `if type(${hex1})==0x1869F then end;`;
        }

        // Thuật toán mã hóa chuỗi tùy biến sang dạng chuỗi Base85 mô phỏng
        function customEncodeString(str) {
            let res = "LYN:";
            for (let i = 0; i < str.length; i++) {
                let code = str.charCodeAt(i);
                let encodedChar = String.fromCharCode((code + 35) % 94 + 33);
                res += encodedChar;
            }
            return res;
        }

        function runObfuscator() {
            const input = document.getElementById('input').value;
            if (!input) return alert("Chưa nhập code!");

            // Tạo các định danh biến độc lập cho cấu trúc máy ảo VM giả lập
            const mainMethod = generateConfusingName(6);
            const varStringSub = generateConfusingName(7);
            const varStringByte = generateConfusingName(7);
            const varStringChar = generateConfusingName(7);
            const varTableInsert = generateConfusingName(7);
            const varXorFunc = generateConfusingName(8);
            const varDecodeFunc = generateConfusingName(8);
            const varStateLoop = generateConfusingName(6);
            const varPayload = generateConfusingName(8);

            // Mã hóa chuỗi đầu vào thành dạng chuỗi nén tùy biến phức tạp
            const obfuscatedPayload = customEncodeString(input);

            let outputCode = `--// This file was obfuscated by Lyn Ultimate V3 Pro [Anti-Decompile & VM Protections]\n\n`;
            outputCode += `return({${mainMethod}=function(${varPayload},${generateConfusingName(5)},${generateConfusingName(4)},${generateConfusingName(4)})\n`;
            
            // Chèn mã độc hại giả lập và toán học rác chống phân tích tĩnh
            outputCode += `    ${generateOpaquePredicate()}local ${generateConfusingName(6)}={};${generateConfusingName(6)}[0x1]=nil;\n`;
            outputCode += `    local ${varStringByte},${varStringChar},${varStringSub}=string.byte,string.char,string.sub;\n`;
            outputCode += `    local ${varTableInsert}=table.insert or function(t,v) t[#t+0x1]=v end;\n`;
            outputCode += `    ${generateOpaquePredicate()}\n`;
            
            // Khối xử lý Bitwise Bxor đa tầng
            outputCode += `    local ${varXorFunc} = bit32 and bit32.bxor or function(a,b)\n`;
            outputCode += `        local r,m = 0,1\n`;
            outputCode += `        while a>0 and b>0 do\n`;
            outputCode += `            local aa,bb = a%2,b%2\n`;
            outputCode += `            if aa~=bb then r=r+m end\n`;
            outputCode += `            a,b,m = (a-aa)/2,(b-bb)/2,m*2\n`;
            outputCode += `        end\n`;
            outputCode += `        if a<b then a=b end\n`;
            outputCode += `        while a>0 do\n`;
            outputCode += `            local aa = a%2\n`;
            outputCode += `            if aa>0 then r=r+m end\n`;
            outputCode += `            a,m = (a-aa)/2,m*2\n`;
            outputCode += `        end\n`;
            outputCode += `        return r\n`;
            outputCode += `    end;\n\n`;

            // Khối hàm giải mã dữ liệu chuỗi VM nâng cao
            outputCode += `    local function ${varDecodeFunc}(data)\n`;
            outputCode += `        local output = {}\n`;
            outputCode += `        local header = ${varStringSub}(data,1,4)\n`;
            outputCode += `        if header == "LYN:" then\n`;
            outputCode += `            for i=5,#data do\n`;
            outputCode += `                local byteVal = ${varStringByte}(${varStringSub}(data,i,i))\n`;
            outputCode += `                local decodedByte = (byteVal - 33 - 35) % 94\n`;
            outputCode += `                if decodedByte < 0 then decodedByte = decodedByte + 94 end\n`;
            outputCode += `                ${varTableInsert}(output, ${varStringChar}(${varXorFunc}(decodedByte, 0x0)))\n`;
            outputCode += `            end\n`;
            outputCode += `        end\n`;
            outputCode += `        return table.concat(output)\n`;
            outputCode += `    end;\n\n`;

            // Khối vòng lặp làm phẳng luồng điều khiển Control Flow Flattening (CFF) bên trong VM
            outputCode += `    local ${varStateLoop} = 0x10 - 0xF;\n`;
            outputCode += `    while true do\n`;
            outputCode += `        if ${varStateLoop} == 0x2 then\n`;
            outputCode += `            ${generateOpaquePredicate()}\n`;
            outputCode += `            local executionResult, executionError = pcall(function()\n`;
            outputCode += `                return (loadstring or load)(${generateConfusingName(9)})\n`;
            outputCode += `            end)\n`;
            outputCode += `            if not executionResult then error(executionError) end\n`;
            outputCode += `            return executionResult(...)\n`;
            outputCode += `        elseif ${varStateLoop} == 0x1 then\n`;
            outputCode += `            if type(loadstring) == "nil" and type(load) == "nil" then return end\n`;
            outputCode += `            ${generateConfusingName(9)} = ${varDecodeFunc}(${varPayload})\n`;
            outputCode += `            ${varStateLoop} = 0x2;\n`;
            outputCode += `        end\n`;
            outputCode += `    end\n`;
            outputCode += `end})` + `:${mainMethod}([==[${obfuscatedPayload}]==],0x${Math.floor(Math.random()*2000).toString(16)},((bit and bit.bxor) or (bit32 and bit32.bxor)))`;

            document.getElementById('output').value = outputCode;
        }

        function copyCode() {
            const out = document.getElementById('output');
            out.select();
            document.execCommand('copy');
            alert("Đã sao chép code siêu nặng!");
        }
    </script>
</body>
</html>
