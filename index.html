<!DOCTYPE html>

<body>
    <div class="container">

        <div class="btn-group">
            <button onclick="obfuscate()">🔒 Mã hóa Bytecode</button>

    <script>
        function toUtf8Bytes(str) {
            return Array.from(new TextEncoder().encode(str));
        }

        function randomName(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
            let result = '';
            for (let i = 0; i < length; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
            return result;
        }

        function mathExpression(value) {
            // Chuyển một con số thành biểu thức toán học cồng kềnh
            const offset1 = Math.floor(Math.random() * 50000) + 10000;
            const offset2 = Math.floor(Math.random() * 50000) + 10000;
            const mix = (value + offset1) - offset2;
            return `((${mix} - ${offset1}) + ${offset2})`;
        }

        function obfuscate() {
            const input = document.getElementById('input').value;
            const statusEl = document.getElementById('status');
            
            if (!input.trim()) {
                statusEl.textContent = '❌ Không có dữ liệu!';
                statusEl.style.color = '#f44';
                return;
            }

            statusEl.textContent = '⏳ Đang băm dữ liệu và đóng gói...';
            statusEl.style.color = '#fa0';

            setTimeout(() => {
                try {
                    const bytes = toUtf8Bytes(input);
                    const shiftKey = Math.floor(Math.random() * 100) + 50;
                    const xorKey = Math.floor(Math.random() * 150) + 20;

                    // Đóng gói byte thành các cụm (clusters)
                    let clusters = [];
                    let currentCluster = [];
                    for (let i = 0; i < bytes.length; i++) {
                        let encodedByte = (bytes[i] ^ xorKey) + shiftKey;
                        currentCluster.push(mathExpression(encodedByte));
                        
                        // Chia ngẫu nhiên từ 5-15 byte mỗi cụm để tạo mảng lồng nhau
                        if (currentCluster.length >= (Math.floor(Math.random() * 10) + 5) || i === bytes.length - 1) {
                            clusters.push(`{${currentCluster.join(',')}}`);
                            currentCluster = [];
                        }
                    }

                    const funcName = randomName(4);
                    const dataName = randomName(3);
                    const iterName = randomName(2);
                    const subIter = randomName(2);
                    const resName = randomName(3);

                    // Xây dựng script Lua với cấu trúc tương tự file bạn đưa (không mã rác)
                    const luaScript = `--// Data Packed by Lyn V3
return (function(...)
    local ${funcName} = loadstring or load
    if not ${funcName} then return end
    
    local ${dataName} = {
        ${clusters.join(',\n        ')}
    }
    
    local ${resName} = {}
    local _k = ${xorKey}
    local _s = ${shiftKey}
    
    local _bxor = bit32 and bit32.bxor or function(a, b)
        local p, c = 1, 0
        while a > 0 and b > 0 do
            local ra, rb = a % 2, b % 2
            if ra ~= rb then c = c + p end
            a, b, p = (a - ra) / 2, (b - rb) / 2, p * 2
        end
        if a < b then a = b end
        while a > 0 do
            local ra = a % 2
            if ra > 0 then c = c + p end
            a, p = (a - ra) / 2, p * 2
        end
        return c
    end

    for _, ${iterName} in ipairs(${dataName}) do
        for _, ${subIter} in ipairs(${iterName}) do
            local val = ${subIter} - _s
            table.insert(${resName}, string.char(_bxor(val, _k)))
        end
    end

    local exec, err = ${funcName}(table.concat(${resName}))
    if exec then return exec(...) end
end)(...)`;

                    document.getElementById('output').value = luaScript;
                    statusEl.textContent = '✅ Đóng gói thành công! Không chứa mã rác.';
                    statusEl.style.color = '#0f0';
                } catch (err) {
                    statusEl.textContent = '❌ Lỗi: ' + err.message;
                    statusEl.style.color = '#f44';
                }
            }, 150);
        }

        function copyResult() {
            const out = document.getElementById('output');
            out.select();
            document.execCommand('copy');
            const st = document.getElementById('status');
            st.textContent = '📋 Đã copy!';
            st.style.color = '#0cf';
            setTimeout(() => st.textContent = '', 2000);
        }
    </script>
