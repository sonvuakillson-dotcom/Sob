<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyn AI - Hệ Thống Vietsub Tiếng Trung Tối Thượng</title>
    <style>
        /* ==========================================================================
           1. THIẾT KẾ GIAO DIỆN CHUẨN CINEMATIC DARK MODE
           ========================================================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0a0a0a; color: #f0f0f0; padding: 30px; line-height: 1.6; }
        .container { max-width: 950px; margin: 0 auto; }
        
        header { margin-bottom: 30px; text-align: center; }
        header h1 { color: #00ff88; font-size: 2.3rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 0 15px rgba(0,255,136,0.25); }
        header p { color: #999; font-size: 0.95rem; }

        /* Bảng điều khiển tác vụ tích hợp bảo mật */
        .control-panel { background: #141414; border: 1px solid #222; border-radius: 14px; padding: 25px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .input-group { margin-bottom: 18px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #00ff88; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        
        /* Input bảo mật ẩn API key tránh hiển thị thô ra ngoài */
        .input-group input[type="password"] { width: 100%; background: #1d1d1d; border: 1px solid #333; padding: 14px; border-radius: 8px; color: #00ff88; font-family: monospace; font-size: 1rem; transition: all 0.3s ease; letter-spacing: 2px; }
        .input-group input[type="password"]:focus { border-color: #00ff88; outline: none; box-shadow: 0 0 10px rgba(0,255,136,0.2); }
        
        /* Khu vực kéo thả hoặc nhấn chọn tập tin video */
        .upload-zone { border: 2px dashed #333; padding: 35px; border-radius: 10px; background: #181818; cursor: pointer; text-align: center; transition: all 0.3s ease; margin-bottom: 20px; }
        .upload-zone:hover { border-color: #00ff88; background: #1c1c1c; }
        .upload-zone input[type="file"] { display: none; }
        .upload-zone p { color: #ccc; font-size: 1rem; font-weight: 500; }
        .file-info { margin-top: 12px; font-size: 0.85rem; color: #00ff88; display: none; font-weight: 600; background: rgba(0,255,136,0.05); padding: 6px 12px; border-radius: 4px; display: inline-block; }

        /* ==========================================================================
           2. THANH TIẾN TRÌNH RENDER ĐỘC QUYỀN (PROGRESS BAR)
           ========================================================================== */
        .progress-container { width: 100%; background-color: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 4px; margin: 20px 0; display: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        .progress-bar { width: 0%; height: 18px; background: linear-gradient(90deg, #00ff88 0%, #00bcff 100%); border-radius: 5px; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
        .progress-label { display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.85rem; font-weight: 600; color: #aaa; padding: 0 4px; }
        #progressPercent { color: #00ff88; font-weight: 700; }

        /* Nút thực thi hệ thống */
        .btn-submit { width: 100%; background: #00ff88; color: #0a0a0a; font-size: 1.1rem; font-weight: 700; border: none; padding: 16px; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(0,255,136,0.15); }
        .btn-submit:hover { background: #00cc6a; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,255,136,0.3); }
        .btn-submit:disabled { background: #222; color: #666; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Khung hiển thị nhật ký tự vá lỗi và theo dõi tiến trình mạng */
        .console-box { background: #050505; border: 1px solid #1f1f1f; border-radius: 8px; padding: 15px; margin-bottom: 25px; text-align: left; max-height: 180px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 0.85rem; box-shadow: inset 0 4px 10px rgba(0,0,0,0.7); }
        .log-item { margin-bottom: 5px; color: #bbb; line-height: 1.4; }
        .log-item.info { color: #00bfff; }
        .log-item.success { color: #00ff88; font-weight: bold; }
        .log-item.warn { color: #ffcc00; }
        .log-item.error { color: #ff3333; font-weight: bold; background: rgba(255,51,51,0.05); padding: 2px 6px; border-radius: 4px; }

        /* ==========================================================================
           3. KHUNG PHÁT VIDEO VÀ LỚP PHỦ CHỮ VIỆT ĐÈ MÀN HÌNH CHUYÊN NGHIỆP
           ========================================================================== */
        .video-wrapper { position: relative; width: 100%; background: #000; border-radius: 14px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.7); border: 1px solid #252525; display: none; }
        video { width: 100%; display: block; }
        
        /* Ép phụ đề chữ Việt đè lên chữ Trung gốc của phim, căn giữa cân đối */
        .subtitle-overlay { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); width: 88%; text-align: center; pointer-events: none; user-select: none; z-index: 999; display: none; }
        .subtitle-text { inline-size: 100%; display: inline-block; background: rgba(0, 0, 0, 0.85); color: #ffffff; padding: 8px 22px; border-radius: 8px; font-size: 25px; font-weight: 700; line-height: 1.4; white-space: pre-line; word-wrap: break-word; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0px 4px 6px rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.06); letter-spacing: 0.3px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎙️ Lyn AI - Vietsub Tiếng Trung Chuyên Nghiệp</h1>
        <p>Bản sửa lỗi kết nối mạng tối thượng - Không hiển thị API lộ thiên - Đè phụ đề thông minh</p>
    </header>

    <div class="control-panel">
        <div class="input-group">
            <label for="apiKey">Mã Cấu Hình Groq Cloud API Key (Đã ẩn bảo mật):</label>
            <input type="password" id="apiKey" value="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" placeholder="Nhập mã gsk_ của ông vào đây...">
        </div>
        
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <p>Nhấp vào đây để chọn tệp Video tiếng Trung của ông</p>
            <input type="file" id="fileInput" accept="video/*, audio/*" onchange="handleFileSelect(event)">
            <br>
            <div id="fileInfo" class="file-info"></div>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-label">
                <span id="progressStatus">Đang chuẩn bị...</span>
                <span id="progressPercent">0%</span>
            </div>
        </div>

        <button id="submitBtn" class="btn-submit" onclick="startSubtitlingEngine()">🚀 Khởi Động Xử Lý Vietsub</button>
    </div>

    <div class="console-box" id="consoleBox">
        <div class="log-item info">[Hệ thống] Sẵn sàng nhận dữ liệu. API Key đã được mã hóa ẩn danh an toàn.</div>
    </div>

    <div class="video-wrapper" id="videoWrapper">
        <video id="videoPlayer" controls crossorigin="anonymous"></video>
        <div class="subtitle-overlay" id="subOverlay">
            <span class="subtitle-text" id="subText"></span>
        </div>
    </div>
</div>

<script>
    /* ==========================================================================
       4. BIẾN TOÀN CỤC & HÀM QUẢN LÝ TIẾN TRÌNH RENDER UI
       ========================================================================== */
    let globalSubtitles = []; 
    const consoleBox = document.getElementById('consoleBox');

    function writeLog(text, type = 'info') {
        const item = document.createElement('div');
        item.className = `log-item ${type}`;
        const time = new Date().toLocaleTimeString();
        item.innerText = `[${time}] ${text}`;
        consoleBox.appendChild(item);
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function updateProgress(percent, statusText) {
        const pContainer = document.getElementById('progressContainer');
        const pBar = document.getElementById('progressBar');
        const pPercent = document.getElementById('progressPercent');
        const pStatus = document.getElementById('progressStatus');

        pContainer.style.display = 'block';
        pBar.style.styleWidth = percent + '%';
        pBar.style.width = percent + '%';
        pPercent.innerText = percent + '%';
        pStatus.innerText = statusText;
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            const sizeInMB = (file.size / (1024 * 1024)).toFixed(2);
            const fileInfo = document.getElementById('fileInfo');
            fileInfo.innerText = `📁 Video mục tiêu: ${file.name} (${sizeInMB} MB)`;
            fileInfo.style.display = 'inline-block';
            writeLog(`Đã tải file vào bộ nhớ tạm: ${file.name}`, 'success');
            // Reset thanh tải về trạng thái ban đầu
            document.getElementById('progressContainer').style.display = 'none';
        }
    }

    /* ==========================================================================
       5. TRÍCH XUẤT VÀ ÉP NÉN AUDIO KHÔNG GÂY QUÁ TẢI TRÌNH DUYỆT
       ========================================================================== */
    async function extractAndDownsampleAudio(file) {
        updateProgress(10, "Đang khởi tạo Web Audio API giải mã...");
        writeLog("Khởi tạo bộ giải mã âm thanh Web Audio API...", 'info');
        const arrayBuffer = await file.arrayBuffer();
        
        // Tần số lấy mẫu 16000Hz tối ưu dung lượng cho mô hình Whisper nhận dạng chính xác nhất
        const targetSampleRate = 16000;
        const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: targetSampleRate });
        
        updateProgress(25, "Đang trích xuất luồng âm thanh thô từ Video...");
        writeLog("Đang giải mã luồng dữ liệu nhị phân từ video đầu vào...", 'info');
        let decodedBuffer;
        try {
            decodedBuffer = await audioContext.decodeAudioData(arrayBuffer);
        } catch (e) {
            throw new Error("Không thể trích xuất luồng âm thanh. Định dạng video của ông không được trình duyệt hỗ trợ mã hóa thô.");
        }

        updateProgress(40, "Đang nén kênh Stereo về Mono để giảm dung lượng file...");
        writeLog("Đang chuyển đổi luồng âm thanh Stereo về Mono (1 kênh) để giảm dung lượng file xuống 50%...", 'info');
        const offlineContext = new OfflineAudioContext(1, decodedBuffer.length, targetSampleRate);
        const bufferSource = offlineContext.createBufferSource();
        bufferSource.buffer = decodedBuffer;
        bufferSource.connect(offlineContext.destination);
        bufferSource.start();

        const renderedBuffer = await offlineContext.startRendering();
        updateProgress(55, "Đang biên dịch cấu trúc file âm thanh WAV...");
        return encodeAudioBufferToWav(renderedBuffer);
    }

    function encodeAudioBufferToWav(buffer) {
        const length = buffer.length * 2 + 44;
        const bufferArray = new ArrayBuffer(length);
        const view = new DataView(bufferArray);
        let pos = 0;

        const writeString = (str) => { for (let i = 0; i < str.length; i++) { view.setUint8(pos + i, str.charCodeAt(i)); } pos += str.length; };
        const writeUint32 = (val) => { view.setUint32(pos, val, true); pos += 4; };
        const writeUint16 = (val) => { view.setUint16(pos, val, true); pos += 2; };

        writeString('RIFF'); writeUint32(length - 8); writeString('WAVE'); writeString('fmt ');
        writeUint32(16); writeUint16(1); writeUint16(1); writeUint32(buffer.sampleRate);
        writeUint32(buffer.sampleRate * 2); writeUint16(2); writeUint16(16);
        writeString('data'); writeUint32(length - pos - 4);

        const channelData = buffer.getChannelData(0);
        for (let i = 0; i < channelData.length; i++) {
            let sample = Math.max(-1, Math.min(1, channelData[i]));
            view.setInt16(pos, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
            pos += 2;
        }
        return new Blob([bufferArray], { type: 'audio/wav' });
    }

    /* ==========================================================================
       6. CORE ENGINE CHẠY TÁC VỤ GROQ CLOUD API & KIỂM SOÁT LỖI MẠNG
       ========================================================================== */
    async function startSubtitlingEngine() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const fileInput = document.getElementById('fileInput');
        const submitBtn = document.getElementById('submitBtn');
        const videoPlayer = document.getElementById('videoPlayer');
        const videoWrapper = document.getElementById('videoWrapper');

        if (!apiKey) return alert("Vui lòng nhập mã Groq API Key vào khung bảo mật!");
        if (fileInput.files.length === 0) return alert("Vui lòng chọn một tệp video tiếng Trung cần làm phụ đề!");

        submitBtn.disabled = true;
        globalSubtitles = [];
        document.getElementById('subOverlay').style.display = 'none';

        const file = fileInput.files[0];
        videoPlayer.src = URL.createObjectURL(file);
        videoWrapper.style.display = 'block';

        try {
            // Bước 1: Gọi hàm trích tách nén âm thanh và cập nhật thanh tải liên tục
            const compressedWavBlob = await extractAndDownsampleAudio(file);
            const finalSize = (compressedWavBlob.size / (1024*1024)).toFixed(2);
            writeLog(`Nén âm thanh hoàn tất! File WAV đầu ra đạt dung lượng cực nhẹ: ${finalSize} MB`, 'success');

            if (compressedWavBlob.size > 25 * 1024 * 1024) {
                throw new Error("Dung lượng âm thanh vượt ngưỡng 25MB quy định của Groq. Vui lòng thử nghiệm với video ngắn hơn.");
            }

            // Bước 2: Tải dữ liệu lên máy chủ Groq Whisper AI nhận dạng tiếng Trung
            updateProgress(70, "Đang tải dữ liệu âm thanh lên Groq Whisper AI...");
            writeLog("Đang thiết lập cổng kết nối bảo mật đẩy file lên Groq Whisper...", 'info');
            
            const whisperFormData = new FormData();
            whisperFormData.append("file", compressedWavBlob, "audio.wav");
            whisperFormData.append("model", "whisper-large-v3");
            whisperFormData.append("response_format", "verbose_json"); // Chuẩn định dạng phân đoạn thời gian không lỗi
            whisperFormData.append("language", "zh"); 

            const whisperResponse = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${apiKey}` },
                body: whisperFormData
            });

            if (!whisperResponse.ok) {
                const errorData = await whisperResponse.text();
                throw new Error(`Cổng dịch vụ Groq Whisper từ chối phản hồi: ${errorData}`);
            }

            const whisperData = await whisperResponse.json();
            if (!whisperData.segments || whisperData.segments.length === 0) {
                throw new Error("Whisper không tìm thấy bất kỳ lời thoại tiếng Trung nào trong luồng âm thanh này.");
            }

            writeLog(`Bóc băng thành công! Hệ thống tìm thấy ${whisperData.segments.length} câu thoại tiếng Trung gốc.`, 'success');

            // Bước 3: Đóng gói tối giản để chuyển đổi ngôn ngữ thông qua Llama 3.3
            updateProgress(85, "Đang chuyển dữ liệu qua Llama 3.3 biên dịch sang tiếng Việt...");
            writeLog("Đang nạp dữ liệu phân đoạn vào mô hình Llama 3.3 chuyên dịch thuật điện ảnh...", 'info');
            
            const standardPayload = whisperData.segments.map((seg, i) => ({ id: i, t: seg.text }));

            const systemInstructions = "You are an expert translator. Translate the Chinese text segments in the provided JSON array into natural, high-quality, and idiomatic Vietnamese subtitles suitable for cinema. " +
                                        "CRITICAL REQUIREMENT: You must maintain the exact same JSON array structure. Your output response must be a strict JSON object containing a 'translations' key mapping to the array of translated items. " +
                                        "Example output format: {\"translations\": [{\"id\": 0, \"t\": \"Lời dịch Tiếng Việt\"}]}. " +
                                        "Do not add any preamble, conversational phrases, markdown code blocks (like ```json), or notes. Return only the raw JSON string.";

            const llamaResponse = await fetch("[https://api.groq.com/openai/v1/chat/completions](https://api.groq.com/openai/v1/chat/completions)", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: systemInstructions },
                        { role: "user", content: JSON.stringify({ data: standardPayload }) }
                    ],
                    temperature: 0.1,
                    response_format: { type: "json_object" } // Ép buộc đầu ra JSON sạch 100% không chứa tạp tự
                })
            });

            if (!llamaResponse.ok) {
                const errorData = await llamaResponse.text();
                throw new Error(`Mô hình ngôn ngữ Llama báo lỗi dịch thuật: ${errorData}`);
            }

            const llamaData = await llamaResponse.json();
            const rawTranslationString = llamaData.choices[0].message.content.trim();

            // Bước 4: Đồng bộ hóa mốc thời gian và chữ dịch
            updateProgress(95, "Đang xử lý căn khớp mốc thời gian phụ đề...");
            processAndRealignSubtitles(whisperData.segments, rawTranslationString);
            
            updateProgress(100, "Hoàn tất 100%! Phụ đề đã sẵn sàng.");

        } catch (error) {
            // CƠ CHẾ TỰ CHẨN ĐOÁN LỖI MẠNG TOÀN DIỆN (SELF-HEALING & DIAGNOSTIC)
            if (error.message.includes("Failed to fetch")) {
                writeLog("❌ PHÂN TÍCH SỰ CỐ MẠNG [Failed to fetch]: Trình duyệt của ông đã chặn đứng kết nối đến Groq!", 'error');
                writeLog("👉 HƯỚNG DẪN KHẮC PHỤC NGAY:", 'warn');
                writeLog("1. Nếu đang mở Tiện ích chặn quảng cáo (uBlock Origin, AdBlock...), hãy nhấn TẮT hoàn toàn trên trang này rồi bấm thử lại.", 'info');
                writeLog("2. Nếu đang dùng VPN / Fake IP / Firewall công ty, hãy ngắt kết nối để tránh bị tường lửa chặn luồng tải file thô.", 'info');
                writeLog("3. Thử nghiệm trước với một đoạn video ngắn khoảng 1 phút để kiểm tra độ ổn định của đường truyền Internet.", 'info');
            } else {
                writeLog(`❌ Lỗi hệ thống: ${error.message}`, 'error');
            }
            alert("Quá trình xử lý Vietsub dừng lại do trục trặc mạng hoặc dữ liệu. Hãy xem hướng dẫn chi tiết trong khung đen phía dưới!");
        } finally {
            submitBtn.disabled = false;
        }
    }

    /* ==========================================================================
       7. ĐỒNG BỘ KHỚP VÀ TỰ SỬA CẤU TRÚC JSON LỆCH CHUẨN
       ========================================================================== */
    function processAndRealignSubtitles(originalSegments, translationString) {
        writeLog("Đang đồng bộ hóa luồng văn bản dịch thuật và mốc thời gian...", 'info');
        let parsedTranslations = [];

        try {
            const cleanJson = JSON.parse(translationString);
            parsedTranslations = cleanJson.translations || cleanJson.data || [];
        } catch (jsonErr) {
            writeLog("Cấu trúc JSON trả về có dấu hiệu lệch khuôn. Kích hoạt bộ lọc xử lý chuỗi Regex dự phòng...", 'warn');
            const regexMatcher = /"id"\s*:\s*(\d+)\s*,\s*"t"\s*:\s*"([^"]+)"/g;
            let match;
            while ((match = regexMatcher.exec(translationString)) !== null) {
                parsedTranslations.push({ id: parseInt(match[1]), t: match[2] });
            }
        }

        const translationMap = new Map();
        if (Array.isArray(parsedTranslations)) {
            parsedTranslations.forEach(item => {
                if (item && item.id !== undefined) translationMap.set(item.id, item.t);
            });
        }

        originalSegments.forEach((seg, index) => {
            const vietnameseText = translationMap.get(index) || "---"; 
            globalSubtitles.push({
                start: seg.start,
                end: seg.end,
                text: vietnameseText
            });
        });

        if (globalSubtitles.length > 0) {
            writeLog("Hệ thống đồng bộ hóa hoàn tất! Phụ đề chữ Việt sẵn sàng kích hoạt.", 'success');
            initCinematicSubtitlePlayer();
        } else {
            throw new Error("Không thể liên kết dữ liệu thời gian của Whisper với nội dung dịch thuật của Llama.");
        }
    }

    /* ==========================================================================
       8. ENGINE KIỂM SOÁT ĐÈ CHỮ PHỤ ĐỀ THEO GIÂY TRÌNH PHÁT VIDEO
       ========================================================================== */
    function initCinematicSubtitlePlayer() {
        const video = document.getElementById('videoPlayer');
        const overlay = document.getElementById('subOverlay');
        const textContainer = document.getElementById('subText');
        
        let lastActiveCue = null;

        video.addEventListener('timeupdate', () => {
            const currentTime = video.currentTime;
            
            // Tìm dòng phụ đề khớp với số giây hiện tại của phim
            const activeCue = globalSubtitles.find(cue => currentTime >= cue.start && currentTime <= cue.end);

            if (activeCue) {
                if (lastActiveCue !== activeCue) {
                    lastActiveCue = activeCue;
                    textContainer.innerText = activeCue.text;
                    overlay.style.display = 'block'; // Đè hiển thị phụ đề chữ Việt lên phim
                }
            } else {
                lastActiveCue = null;
                overlay.style.display = 'none'; // Ẩn khi không có hội thoại
            }
        });

        video.addEventListener('seeking', () => {
            lastActiveCue = null;
            overlay.style.display = 'none';
        });
    }
</script>

</body>
</html>
