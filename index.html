<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: #050505; color: #d0d0d0; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 1200px; background: #0a0c10; border-radius: 12px; padding: 30px; box-shadow: 0 0 50px rgba(255, 0, 85, 0.15); border: 1px solid #2a0815; }
        h1 { text-align: center; color: #ff0055; margin-bottom: 5px; font-size: 2.5rem; letter-spacing: 2px; text-shadow: 0 0 20px rgba(255, 0, 85, 0.5); text-transform: uppercase; }
        .subtitle { text-align: center; color: #6b7280; margin-bottom: 25px; font-size: 1rem; }
        textarea { width: 100%; height: 220px; background: #000; border: 1px solid #333; color: #ff0055; font-family: 'Consolas', monospace; padding: 15px; border-radius: 8px; resize: vertical; font-size: 13px; margin-bottom: 20px; white-space: pre; overflow-wrap: normal; overflow-x: scroll; }
        textarea:focus { outline: none; border-color: #ff0055; box-shadow: 0 0 15px rgba(255, 0, 85, 0.2); }
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        button { background: #ff0055; border: none; color: #fff; padding: 12px 30px; font-weight: bold; font-size: 15px; border-radius: 6px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
        button:hover { background: #cc0044; box-shadow: 0 0 20px rgba(255, 0, 85, 0.4); transform: translateY(-2px); }
        button.copy { background: #2563eb; }
        button.copy:hover { background: #1d4ed8; box-shadow: 0 0 20px rgba(37, 99, 235, 0.4); }
        .label { font-weight: bold; color: #9ca3af; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 8px; display: flex; justify-content: space-between; }
        #status { color: #ff0055; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ LYN VM XHIDER</h1>
        <div class="subtitle">Fake Virtual Machine Architecture - Constant Pool Optimized</div>

        <div class="label"><span>Input Lua Script</span></div>
        <textarea id="input" spellcheck="false" placeholder="Dán mã nguồn Lua hoạt động 100% vào đây..."></textarea>

        <div class="btn-group">
            <button onclick="obfuscate()">🔒 Mã Hóa Chuẩn XHIDER</button>
            <button class="copy" onclick="copyResult()">📋 Copy Kết Quả</button>
        </div>

        <div class="label"><span>Output (Max Hidden Matrix)</span><span id="status">Sẵn sàng</span></div>
        <textarea id="output" readonly placeholder="Mã sau khi băm sẽ xuất hiện ở đây..."></textarea>
    </div>

    <script>
        const constantPool = [];
        for (let i = 0; i < 150; i++) {
            constantPool.push(Math.floor(Math.random() * 900000) + 100000);
        }

        function toUtf8Bytes(str) {
            return Array.from(new TextEncoder().encode(str));
        }

        function extremeMath(val) {
            const numPairs = Math.floor(Math.random() * 4) + 3; 
            let str = `${val}`;
            for (let i = 0; i < numPairs; i++) {
                const r = constantPool[Math.floor(Math.random() * constantPool.length)];
                str += (Math.random() > 0.5) ? ` + ${r} - ${r}` : ` - ${r} + ${r}`;
            }
            return `(${str})`;
        }

        function generateVar() {
            let res = '';
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
            for (let i = 0; i < 6; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
            return res;
        }

        function obfuscate() {
            const input = document.getElementById('input').value;
            const statusEl = document.getElementById('status');
            
            if (!input.trim()) {
                statusEl.textContent = '❌ Trống!';
                return;
            }

            statusEl.textContent = '⏳ Đang khởi tạo VM Matrix...';
            
            setTimeout(() => {
                try {
                    const bytes = toUtf8Bytes(input);
                    const shiftKey = Math.floor(Math.random() * 150) + 50;
                    
                    let dataChunks = [];
                    let currentChunk = [];

                    // Băm dữ liệu thành các cục giống hệt cấu trúc XHider: q[1]({...})
                    for (let i = 0; i < bytes.length; i++) {
                        currentChunk.push(extremeMath(bytes[i] + shiftKey));
                        if (currentChunk.length >= 15 || i === bytes.length - 1) {
                            // Trộn thêm rác dạng chuỗi để đánh lừa luồng đọc
                            const junkStr = `"${Math.random().toString(36).substring(2, 8)}"`;
                            const chunkData = currentChunk.join(',');
                            dataChunks.push(`q[1]({${chunkData}, ${junkStr}})`);
                            currentChunk = [];
                        }
                    }

                    // Các biến nội bộ ảo
                    const v_env = generateVar();
                    const v_str = generateVar();
                    const v_tab = generateVar();
                    const v_ins = generateVar();
                    const v_load = generateVar();
                    const v_buf = generateVar();

                    const luaScript = `--// This file was protected by Lyn VM XHider Architecture
return(function(...)
    local ${v_env}, ${v_str}, ${v_tab}, ${v_ins} = getfenv and getfenv() or _ENV, string.char, table.concat, table.insert
    local ${v_load} = ${v_env}.loadstring or ${v_env}.load
    if not ${v_load} then return end
    
    local q = {}
    q[1] = function(d)
        local t = {}
        for i = 1, #d do
            if type(d[i]) == "number" then
                ${v_ins}(t, ${v_str}(d[i] - ${extremeMath(shiftKey)}))
            end
        end
        return ${v_tab}(t)
    end
    
    q[9] = {
        ${dataChunks.join(',\n        ')}
    }
    
    -- Control Flow Flattening (Fake VM Dispatcher)
    local ${v_buf} = {}
    local state = 1
    while true do
        if state == 2 then
            local exec = ${v_load}(${v_tab}(${v_buf}))
            if exec then return exec(...) end
            break
        elseif state == 1 then
            for _, block in ipairs(q[9]) do
                if type(block) == "string" then
                    ${v_ins}(${v_buf}, block)
                end
            end
            state = 2
        elseif state == 3 then
            -- Junk state to confuse decompilers
            state = 1
        end
    end
end)(...)`;

                    document.getElementById('output').value = luaScript;
                    statusEl.textContent = `✅ Hoàn tất!`;
                } catch (e) {
                    statusEl.textContent = `❌ Lỗi: ` + e.message;
                }
            }, 50);
        }

        function copyResult() {
            const out = document.getElementById('output');
            if(!out.value) return;
            out.select();
            document.execCommand('copy');
            document.getElementById('status').textContent = '📋 Đã Copy!';
        }
    </script>
</body>
</html>
