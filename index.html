<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyn AI - Vietsub Pro (Bypass 25MB Limit)</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #121212; color: #ffffff; max-width: 850px; margin: 0 auto; padding: 20px; text-align: center; }
        h1 { color: #00ff88; margin-bottom: 5px; }
        .upload-box { border: 2px dashed #00ff88; padding: 25px; border-radius: 12px; margin-bottom: 20px; background: #1e1e1e; }
        button { background-color: #00ff88; color: #000; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        button:hover { background-color: #00cc6a; transform: scale(1.02); }
        .video-container { position: relative; display: inline-block; width: 100%; margin-top: 20px; border-radius: 12px; overflow: hidden; box-shadow: 0px 10px 30px rgba(0,0,0,0.5); background: #000; }
        #player { width: 100%; display: none; vertical-align: bottom; }
        #sub-overlay { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.75); color: #ffffff; padding: 6px 16px; border-radius: 6px; font-size: 22px; font-weight: bold; text-align: center; pointer-events: none; display: none; max-width: 85%; white-space: pre-line; text-shadow: 2px 2px 4px #000000; line-height: 1.4; z-index: 10; }
        #status { margin-top: 15px; color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🎙️ Lyn AI - Hệ Thống Vietsub & Lồng Tiếng (Bản Bypass Mở Rộng)</h1>
    <p style="color: #aaa;">Tự động tách âm thanh, ép dung lượng vượt rào Groq cho file dài 10-15 phút.</p>

    <div class="upload-box">
        <input type="file" id="videoFile" accept="video/*, audio/*">
        <div style="margin-top: 10px;">
            <input type="checkbox" id="enableVoice" checked>
            <label for="enableVoice">🎙️ Bật lồng tiếng chuẩn giọng Việt Nam</label>
        </div>
        <button onclick="processVideo()">🚀 Xử Lý Vietsub Ngay</button>
        <div id="status">Sẵn sàng! Hãy chọn file video của bạn.</div>
    </div>

    <div class="video-container">
        <video id="player" controls crossorigin="anonymous"></video>
        <div id="sub-overlay"></div>
    </div>

    <script>
        const GROQ_API_KEY = "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";
        let globalCues = [];
        let ttsAudio = new Audio();

        function setStatus(msg) { document.getElementById('status').innerText = msg; }

        async function processVideo() {
            const fileInput = document.getElementById('videoFile');
            const file = fileInput.files[0];
            if (!file) return alert("Vui lòng chọn file video!");

            const video = document.getElementById('player');
            const subOverlay = document.getElementById('sub-overlay');
            
            globalCues = [];
            subOverlay.style.display = "none";
            ttsAudio.pause();
            
            video.style.display = 'block';
            video.src = URL.createObjectURL(file);

            try {
                // BƯỚC 1: TÁCH VÀ NÉN ÂM THANH NGAY TRÊN TRÌNH DUYỆT
                setStatus("⚙️ Đang tách âm thanh khỏi video và ép dung lượng (vượt rào 25MB)...");
                const compressedAudioBlob = await extractAndCompressAudio(file);
                
                if (compressedAudioBlob.size > 25 * 1024 * 1024) {
                    throw new Error("File quá dài! Dù đã nén tối đa nhưng vẫn vượt 25MB (Chỉ nên dùng video dưới 15 phút).");
                }

                // BƯỚC 2: GỬI LÊN GROQ WHISPER
                setStatus("🚀 Đang gửi âm thanh siêu nhẹ cho AI Whisper bóc băng...");
                const formData = new FormData();
                // Đặt tên file là audio.wav để đánh lừa Whisper
                formData.append("file", compressedAudioBlob, "audio.wav"); 
                formData.append("model", "whisper-large-v3");
                formData.append("response_format", "vtt");

                const whisperRes = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${GROQ_API_KEY}` },
                    body: formData
                });

                if (!whisperRes.ok) throw new Error("Lỗi bóc băng: " + await whisperRes.text());
                const originalVTT = await whisperRes.text();

                // BƯỚC 3: DỊCH CHUẨN XÁC VỚI LLAMA 3
                setStatus("🧠 Đang dịch chuẩn ngữ cảnh sang Tiếng Việt...");
                const prompt = `Dịch toàn bộ file WebVTT sau sang Tiếng Việt. Giữ nguyên mốc thời gian. Chỉ trả về mã WEBVTT đã dịch, không giải thích.\n\n${originalVTT}`;
                const llamaRes = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ model: "llama3-70b-8192", messages: [{role: "user", content: prompt}], temperature: 0.1 })
                });

                const llamaData = await llamaRes.json();
                let translatedVTT = llamaData.choices[0].message.content.trim();
                if (!translatedVTT.startsWith("WEBVTT")) translatedVTT = "WEBVTT\n\n" + translatedVTT;

                // BƯỚC 4: HIỂN THỊ VÀ ĐỌC GIỌNG
                setStatus("✅ Hoàn tất! Bấm Play trên video để xem Vietsub đè và nghe lồng tiếng.");
                globalCues = parseVTT(translatedVTT);
                initSubAndVoiceEngine(video, subOverlay);

            } catch (error) {
                setStatus("❌ Lỗi: " + error.message);
                console.error(error);
            }
        }

        // HÀM TÁCH VÀ ÉP DUNG LƯỢNG AUDIO BẰNG JAVASCRIPT
        async function extractAndCompressAudio(file) {
            const arrayBuffer = await file.arrayBuffer();
            // Thiết lập AudioContext nén xuống 16kHz (chuẩn của Whisper)
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            const numOfChannels = 1; // Ép về âm thanh Mono (1 kênh) để giảm 50% dung lượng
            const length = audioBuffer.length;
            const sampleRate = 16000;
            const offlineCtx = new OfflineAudioContext(numOfChannels, length, sampleRate);
            const source = offlineCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(offlineCtx.destination);
            source.start();
            
            const renderedBuffer = await offlineCtx.startRendering();
            return audioBufferToWav(renderedBuffer);
        }

        function audioBufferToWav(buffer) {
            const numOfChan = buffer.numberOfChannels;
            const length = buffer.length * numOfChan * 2 + 44;
            const out = new ArrayBuffer(length);
            const view = new DataView(out);
            const channels = [];
            let sample, offset = 0, pos = 0;

            const setUint16 = (data) => { view.setUint16(pos, data, true); pos += 2; };
            const setUint32 = (data) => { view.setUint32(pos, data, true); pos += 4; };

            setUint32(0x46464952); // "RIFF"
            setUint32(length - 8);
            setUint32(0x45564157); // "WAVE"
            setUint32(0x20746d66); // "fmt "
            setUint32(16);
            setUint16(1); // PCM
            setUint16(numOfChan);
            setUint32(buffer.sampleRate);
            setUint32(buffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2);
            setUint16(16);
            setUint32(0x61746164); // "data"
            setUint32(length - pos - 4);

            for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));
            while (pos < length) {
                for (let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    view.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }
            return new Blob([out], { type: "audio/wav" });
        }

        function parseVTT(vttText) {
            const lines = vttText.split('\n');
            const cues = [];
            let currentCue = null;
            const timeRegex = /(\d{2}:\d{2}:\d{2}[\.,]\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2}[\.,]\d{3})/;
            const toSeconds = (t) => { const p = t.replace(',', '.').split(':'); return parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2]); };

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                const match = line.match(timeRegex);
                if (match) currentCue = { start: toSeconds(match[1]), end: toSeconds(match[2]), text: "" };
                else if (currentCue && line && !line.startsWith("WEBVTT")) currentCue.text += (currentCue.text ? "\n" : "") + line;
                else if (!line && currentCue) { cues.push(currentCue); currentCue = null; }
            }
            if (currentCue) cues.push(currentCue);
            return cues;
        }

        function initSubAndVoiceEngine(video, subOverlay) {
            let lastText = "";
            video.addEventListener('timeupdate', () => {
                const t = video.currentTime;
                const activeCue = globalCues.find(c => t >= c.start && t <= c.end);
                if (activeCue) {
                    if (lastText !== activeCue.text) {
                        lastText = activeCue.text;
                        subOverlay.innerText = activeCue.text;
                        subOverlay.style.display = 'block';
                        playVietnameseVoice(activeCue.text);
                    }
                } else { lastText = ""; subOverlay.style.display = 'none'; }
            });
            video.addEventListener('pause', () => ttsAudio.pause());
            video.addEventListener('seeking', () => ttsAudio.pause());
        }

        function playVietnameseVoice(text) {
            if (!document.getElementById('enableVoice').checked) return;
            ttsAudio.pause();
            const cleanText = text.replace(/\n/g, " ");
            ttsAudio.src = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encodeURIComponent(cleanText)}`;
            ttsAudio.play().catch(() => {});
        }
    </script>
</body>
</html>
