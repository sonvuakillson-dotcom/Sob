<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyn AI - Vietsub & Lồng Tiếng</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #00ff88; }
        .upload-box {
            border: 2px dashed #00ff88;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            background: #1e1e1e;
        }
        button {
            background-color: #00ff88;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #00cc6a; }
        #player {
            width: 100%;
            margin-top: 20px;
            border-radius: 10px;
            display: none;
        }
        #status { margin-top: 15px; color: #ffcc00; font-style: italic; }
        .options { margin-top: 15px; }
    </style>
</head>
<body>

    <h1>🎙️ Lyn AI - Hệ Thống Vietsub & Lồng Tiếng</h1>
    <p>Tự động bóc băng, dịch chuẩn xác và đọc giọng Việt Nam.</p>

    <div class="upload-box">
        <input type="file" id="videoFile" accept="video/*, audio/*">
        <div class="options">
            <input type="checkbox" id="enableVoice" checked>
            <label for="enableVoice">Bật giọng đọc Tiếng Việt (Lyn AI Voice)</label>
        </div>
        <button onclick="processVideo()">Tạo Vietsub Ngay</button>
        <div id="status"></div>
    </div>

    <video id="player" controls crossorigin="anonymous"></video>

    <script>
        // API Key bạn đã cung cấp
        const GROQ_API_KEY = "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";

        function setStatus(msg) {
            document.getElementById('status').innerText = msg;
        }

        async function processVideo() {
            const fileInput = document.getElementById('videoFile');
            const file = fileInput.files[0];
            
            if (!file) {
                alert("Vui lòng chọn một file video hoặc audio!");
                return;
            }

            // Giới hạn của API Whisper Groq là 25MB
            if (file.size > 25 * 1024 * 1024) {
                alert("File quá lớn! Groq API hiện tại chỉ nhận file dưới 25MB.");
                return;
            }

            const video = document.getElementById('player');
            video.style.display = 'block';
            video.src = URL.createObjectURL(file);
            
            try {
                // Bước 1: Gọi Whisper bóc băng
                setStatus("Lyn AI đang nghe và trích xuất âm thanh (Whisper V3)...");
                const formData = new FormData();
                formData.append("file", file);
                formData.append("model", "whisper-large-v3");
                formData.append("response_format", "vtt");

                const whisperRes = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${GROQ_API_KEY}` },
                    body: formData
                });

                if (!whisperRes.ok) throw new Error("Lỗi bóc băng: " + await whisperRes.text());
                const originalVTT = await whisperRes.text();

                // Bước 2: Gọi Llama 3 dịch sang Tiếng Việt
                setStatus("Lyn AI đang dịch chuẩn xác sang Tiếng Việt...");
                const prompt = `Dịch toàn bộ file WebVTT sau sang Tiếng Việt. 
Yêu cầu:
1. Dịch thuật tự nhiên, chuẩn xác, không lỗi văn cảnh.
2. TUYỆT ĐỐI GIỮ NGUYÊN cấu trúc thời gian (timestamps).
3. CHỈ TRẢ VỀ nội dung WebVTT đã dịch, bắt đầu bằng "WEBVTT". Không kèm theo bất kỳ lời chào hay giải thích nào.

Nội dung gốc:
${originalVTT}`;

                const llamaRes = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-70b-8192", // Model lớn nhất để dịch không lỗi
                        messages: [{role: "user", content: prompt}],
                        temperature: 0.1 // Giữ nhiệt độ thấp để AI tập trung dịch chính xác, không chế cháo
                    })
                });

                const llamaData = await llamaRes.json();
                let translatedVTT = llamaData.choices[0].message.content.trim();
                
                // Đảm bảo format VTT hợp lệ
                if (!translatedVTT.startsWith("WEBVTT")) {
                    translatedVTT = "WEBVTT\n\n" + translatedVTT;
                }

                // Bước 3: Nạp Subtitle vào Video
                setStatus("Hoàn tất! Đang đồng bộ phụ đề và giọng đọc...");
                const blob = new Blob([translatedVTT], { type: 'text/vtt' });
                const track = document.createElement('track');
                track.kind = 'captions';
                track.label = 'Tiếng Việt (Lyn AI)';
                track.srclang = 'vi';
                track.src = URL.createObjectURL(blob);
                track.default = true;
                
                // Xóa track cũ nếu có
                while (video.firstChild) {
                    video.removeChild(video.firstChild);
                }
                video.appendChild(track);

                // Thiết lập Giọng Đọc Việt Nam
                setupVoice(video);
                
                setStatus("✅ Hoàn thành! Bấm Play để xem thành quả.");

            } catch (error) {
                setStatus("❌ Có lỗi xảy ra: " + error.message);
                console.error(error);
            }
        }

        function setupVoice(video) {
            const enableVoice = document.getElementById('enableVoice').checked;
            if (!enableVoice) return;

            video.addEventListener('loadedmetadata', function() {
                const trackElement = video.textTracks[0];
                if (!trackElement) return;
                
                trackElement.mode = 'showing'; 
                
                trackElement.oncuechange = (e) => {
                    const activeCues = e.target.activeCues;
                    if (activeCues && activeCues.length > 0) {
                        const text = activeCues[0].text;
                        // Gọi AI đọc giọng Việt Nam
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = 'vi-VN';
                        utterance.rate = 1.1; // Chỉnh tốc độ đọc cho tự nhiên
                        window.speechSynthesis.speak(utterance);
                    }
                };

                // Ngừng đọc khi video tạm dừng hoặc tua
                video.addEventListener('pause', () => window.speechSynthesis.cancel());
                video.addEventListener('seeked', () => window.speechSynthesis.cancel());
            });
        }
    </script>
</body>
</html>
