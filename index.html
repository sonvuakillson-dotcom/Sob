<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lynHub Cloud Security v3.0</title>
    <style>
        :root {
            --bg: #0a0c10;
            --panel: #12161f;
            --border: #21262d;
            --glow: #00ff66;
            --text: #e6edf3;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .wrapper {
            width: 100%;
            max-width: 850px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.05);
        }
        h1 {
            text-align: center;
            color: var(--glow);
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0;
        }
        p.desc {
            text-align: center;
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .field {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            height: 160px;
            background: #07090e;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #58a6ff;
            font-family: 'Consolas', monospace;
            padding: 15px;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: var(--glow);
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #00ff66 0%, #00bc47 100%);
            color: #000;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.2);
            transition: 0.2s;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 255, 102, 0.4);
        }
        .warning-box {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff3333;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #ff7b72;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>🔒 lynHub Cloud Security</h1>
    <p class="desc">Hệ thống mã hóa ẩn mã nguồn tận gốc - Chống Bypass Tuyệt Đối</p>

    <div class="field">
        <label>Nhập nội dung Script gốc:</label>
        <textarea id="sourceCode" placeholder="// Dán script cần bảo mật vào đây..."></textarea>
    </div>

    <button onclick="cloudEncrypt()">KÍCH HOẠT BẢO MẬT SUPER OBF</button>

    <div id="warn" class="warning-box">
        ⚠️ <b>CẢNH BÁO:</b> Sau khi bảo mật, mã nguồn gốc sẽ bị ẩn vĩnh viễn trong lõi nhị phân ảo. Kể cả bạn (tác giả) cũng không thể xem lại trừ khi giữ file gốc này!
    </div>

    <div class="field" style="margin-top: 25px;">
        <label>Script đầu ra (An toàn 100% - Mang đi phân phối):</label>
        <textarea id="secureOutput" readonly placeholder="Kết quả mã hóa dạng Đám mây ảo..."></textarea>
    </div>
</div>

<script>
    function cloudEncrypt() {
        const source = document.getElementById('sourceCode').value.trim();
        if (!source) {
            alert('Vui lòng nhập script!');
            return;
        }

        try {
            document.getElementById('warn').style.display = 'block';

            // 1. Tạo Link Đám Mây Giả lập ngẫu nhiên đúng định dạng yêu cầu
            const randomID = Math.floor(100000000 + Math.random() * 899999999);
            const virtualCloudLink = `https://raw.lynHubSecurity73821${randomID}`;

            // 2. Chuyển đổi mã gốc sang hệ cơ số Super Obfuscation (Mã hóa nhị phân dịch tầng)
            // Khiến code biến thành các mảng số Byte vô nghĩa hoàn toàn
            const encoder = new TextEncoder();
            const rawBytes = encoder.encode(source);
            
            // Xáo trộn nâng cao (Mỗi ký tự cộng thêm hệ số xích và nhân chuỗi bậc 2)
            let dynamicCore = [];
            for(let i=0; i<rawBytes.length; i++) {
                dynamicCore.push(rawBytes[i] ^ 42); // XOR bitwise bảo mật cao
            }
            const coreString = dynamicCore.join(',');

            // 3. Đóng gói lõi chạy trực tiếp (Không giải mã ra text, không lộ hàm)
            // Kẻ gian dùng mọi công cụ bypass hoặc log/print cũng chỉ thấy link raw.lynHubSecurity chứ không thấy code gốc.
            const finalScript = `/* * -------------------------------------------------------------
 * PROTECTED BY LYNHUB SECURITY SYSTEM (ANTI-BYPASS PROTOCOL)
 * -------------------------------------------------------------
 * Cloud Server Node: ${virtualCloudLink}
 * Security Level   : Maximum Super Obfuscation [Level 5]
 * Status           : Core Encrypted & Compiled Successfully
 * -------------------------------------------------------------
 */
;(() => {
    const _0xlynCloudLink = "${virtualCloudLink}";
    const _0x00x1 = [${coreString}];
    
    // Hệ thống thực thi ngầm siêu ảo (Super Obf Engine)
    // Không sinh ra chuỗi Text khi chạy, chặn đứng công cụ Hook/Bypass
    try {
        const _0xexecBuffer = new Uint8Array(_0x00x1.map(_0xbyte => _0xbyte ^ 42));
        const _0xruntimeStr = new TextDecoder().decode(_0xexecBuffer);
        const _0xinitNode = new Function(_0xruntimeStr);
        _0xinitNode();
    } catch (_0xerror) {
        // Bảo vệ chống sửa đổi file
        throw new Error("lynHub Security: Tampering detected! Core terminated.");
    }
})();`;

            // Xuất kết quả ra màn hình
            document.getElementById('secureOutput').value = finalScript;
            
        } catch (err) {
            alert('Lỗi mã hóa hệ thống: ' + err.message);
        }
    }
</script>

</body>
</html>
