<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lightbot System - Protected Engine</title>
<style>
  /* ==========================================
     LIGHTBOT UI STYLES (FRONT-END CLEAN)
     ========================================== */
  
  /* Nút Chat Icon Nổi (Tia sét) */
  #lightbot-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    background: #1a1a1a;
    color: #00ffcc;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 30px;
    box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
    transition: 0.3s;
    z-index: 9999;
    border: 2px solid #00ffcc;
    user-select: none;
  }
  #lightbot-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px rgba(0, 255, 204, 0.8);
  }

  /* Khung Chatbot */
  #lightbot-box {
    display: none;
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 350px;
    height: 500px;
    background: #222;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    flex-direction: column;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    border: 1px solid #333;
    z-index: 9998;
  }
  
  /* Tiêu đề thanh Header */
  #lb-header {
    background: #111;
    color: #00ffcc;
    padding: 15px;
    font-weight: bold;
    text-align: center;
    border-bottom: 2px solid #00ffcc;
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: 1px;
    user-select: none;
  }
  
  /* Khu vực nội dung tin nhắn */
  #lb-messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
  }
  
  /* Các bong bóng hội thoại */
  .msg {
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 15px;
    max-width: 80%;
    word-wrap: break-word;
    font-size: 14px;
    line-height: 1.4;
  }
  .msg.user {
    background: #007bff;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 2px;
  }
  .msg.bot {
    background: #333;
    color: #fff;
    align-self: flex-start;
    border-bottom-left-radius: 2px;
    border: 1px solid #444;
  }
  /* Hiệu ứng trạng thái AI đang suy nghĩ */
  .msg.thinking {
    color: #00ffcc;
    font-style: italic;
    opacity: 0.8;
    background: rgba(0, 255, 204, 0.05);
    border: 1px dashed #00ffcc;
  }

  /* Khu vực thanh nhập liệu phía dưới */
  #lb-input-area {
    display: flex;
    background: #111;
    padding: 10px;
    border-top: 1px solid #333;
  }
  #lb-input {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #222;
    color: white;
    outline: none;
    margin-right: 10px;
  }
  #lb-send {
    padding: 0 20px;
    background: #00ffcc;
    color: #000;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
  }
  #lb-send:hover {
    background: #00ccaa;
  }
</style>
</head>
<body>

<div id="lightbot-btn">⚡</div>
<div id="lightbot-box">
  <div id="lb-header">Lightbot System</div>
  <div id="lb-messages">
    <div class="msg bot">Xin chào! Mình là Lightbot. Mình có thể giúp gì cho website của bạn?</div>
  </div>
  <div id="lb-input-area">
    <input type="text" id="lb-input" placeholder="Nhập câu hỏi mã hóa...">
    <button id="lb-send">Gửi</button>
  </div>
</div>
