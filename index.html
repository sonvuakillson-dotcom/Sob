<script>
(function() {
  // ========== TỰ VIẾT BỘ PHÂN TÍCH LUA NHẸ ==========
  // Hỗ trợ: chuỗi đơn, chuỗi kép, chuỗi dài [[ ]], comment --, comment --[[ ]]
  function tokenize(code) {
    const tokens = []; // mỗi token: {type, value, start, end}
    let i = 0;
    const len = code.length;
    while (i < len) {
      // Bỏ qua khoảng trắng (nhưng ta vẫn giữ lại để tái tạo code)
      // Ta sẽ xây dựng kết quả bằng cách thay thế trực tiếp, nên tokenize không cần giữ whitespace riêng.
      // Thay vào đó, ta tìm các điểm cần thay thế (string literal hoặc định danh) và ghi nhận vị trí.
      // Để đơn giản, ta chỉ lấy danh sách string literals.
      // Xác định chuỗi
      if (code[i] === '"' || code[i] === "'" || code[i] === '[') {
        // Kiểm tra chuỗi dài [[ ... ]]
        if (code[i] === '[' && code[i+1] === '[') {
          let j = i+2;
          while (j < len && !(code[j] === ']' && code[j+1] === ']')) j++;
          if (j < len) {
            const strContent = code.substring(i+2, j);
            tokens.push({type: 'longstring', value: strContent, start: i, end: j+2});
            i = j+2;
            continue;
          } else {
            // lỗi, coi như ký tự bình thường
            i++;
            continue;
          }
        }
        // Chuỗi thường
        const quote = code[i];
        let j = i+1;
        let escaped = false;
        while (j < len) {
          if (escaped) { escaped = false; j++; continue; }
          if (code[j] === '\\') { escaped = true; j++; continue; }
          if (code[j] === quote) break;
          j++;
        }
        if (j < len) {
          const strContent = code.substring(i+1, j);
          tokens.push({type: 'string', quote: quote, value: strContent, start: i, end: j+1});
          i = j+1;
          continue;
        } else {
          i++; continue;
        }
      }
      // Bỏ qua comment
      if (code[i] === '-' && code[i+1] === '-') {
        if (code[i+2] === '[' && code[i+3] === '[') {
          // block comment
          let j = i+4;
          while (j < len && !(code[j] === ']' && code[j+1] === ']')) j++;
          if (j < len) {
            i = j+2;
            continue;
          } else {
            i = len;
            continue;
          }
        } else {
          // line comment đến cuối dòng
          let j = i+2;
          while (j < len && code[j] !== '\n') j++;
          i = j;
          continue;
        }
      }
      i++;
    }
    return tokens;
  }

  // ========== HÀM MÃ HÓA XOR ==========
  function generateRandomKey(length = 8) {
    const arr = new Uint8Array(length);
    window.crypto.getRandomValues(arr);
    return String.fromCharCode(...arr);
  }

  function xorBytes(str, key) {
    const out = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) {
      out[i] = (str.charCodeAt(i) & 0xFF) ^ (key.charCodeAt(i % key.length) & 0xFF);
    }
    return out;
  }

  function bytesToLuaEscape(bytes) {
    return Array.from(bytes, b => '\\' + b.toString(10).padStart(3, '0')).join('');
  }

  // ========== THAY THẾ CHUỖI ==========
  function encryptStrings(code) {
    const tokens = tokenize(code);
    let result = '';
    let lastIdx = 0;
    for (const tok of tokens) {
      // Thêm phần code trước token
      result += code.substring(lastIdx, tok.start);
      const key = generateRandomKey(6 + Math.floor(Math.random() * 8));
      const rawValue = tok.value;
      const encrypted = xorBytes(rawValue, key);
      const encStr = bytesToLuaEscape(encrypted);
      const keyStr = bytesToLuaEscape([...key].map(c => c.charCodeAt(0)));
      result += `lyn_decrypt("${encStr}","${keyStr}")`;
      lastIdx = tok.end;
    }
    result += code.substring(lastIdx);
    return result;
  }

  // ========== TẠO MÃ RÁC ==========
  let junkCounter = 0;
  function freshJunkName() { return 'j_' + (++junkCounter).toString(36); }
  function generateJunkLines(count = 3) {
    const lines = [];
    for (let i = 0; i < count; i++) {
      const r = Math.random();
      if (r < 0.3) {
        lines.push(`local ${freshJunkName()} = (${Math.floor(Math.random()*1000)} + ${Math.floor(Math.random()*500)}) / 2;`);
      } else if (r < 0.6) {
        lines.push(`if (0x${Math.floor(Math.random()*0xFF).toString(16)} > ${Math.floor(Math.random()*50)}) then end`);
      } else {
        lines.push(`task.wait(${(0.05 + Math.random()*0.2).toFixed(2)})`);
      }
    }
    return lines.join('\n');
  }

  // ========== TẠO HEADER ==========
  let dCounter = 0;
  function freshDecryptName() { return '_d' + (++dCounter).toString(36); }
  function buildHeader() {
    const n = {
      char: freshDecryptName(), byte: freshDecryptName(), sub: freshDecryptName(),
      bit: freshDecryptName(), bxor: freshDecryptName(), concat: freshDecryptName(), insert: freshDecryptName()
    };
    return `
--[[
 ██╗     ██╗   ██╗███╗   ██╗     ██████╗ ██████╗ ███████╗██╗   ██╗███████╗ ██████╗ █████╗ ████████╗███████╗
 ██║     ╚██╗ ██╔╝████╗  ██║    ██╔═══██╗██╔══██╗██╔════╝██║   ██║██╔════╝██╔════╝██╔══██╗╚══██╔══╝██╔════╝
 ██║      ╚████╔╝ ██╔██╗ ██║    ██║   ██║██████╔╝█████╗  ██║   ██║███████╗██║     ███████║   ██║   █████╗  
 ██║       ╚██╔╝  ██║╚██╗██║    ██║   ██║██╔══██╗██╔══╝  ██║   ██║╚════██║██║     ██╔══██║   ██║   ██╔══╝

local ${n.char} = string.char;
local ${n.byte} = string.byte;
local ${n.sub} = string.sub;
local ${n.bit} = bit32 or bit;
local ${n.bxor} = ${n.bit}.bxor;

local function lyn_decrypt(data, key)
  local result = {};
  for i = 1, #data do
    ${n.insert}(result, ${n.char}(${n.bxor}(${n.byte}(${n.sub}(data, i, i)), ${n.byte}(${n.sub}(key, 1 + (i % #key), 1 + (i % #key)))) % 256));

  return ${n.concat}(result);

-- Junk start
${generateJunkLines(4)}

`;
  }

  // ========== OBFUSCATE CHÍNH ==========
  function obfuscate(code) {
    if (!code.trim()) throw new Error('No code provided');
    let obfCode = code;

    // Ghép header + code + footer
    const header = buildHeader();
    const footer = `\n-- Junk end\n${generateJunkLines(2)}\n`;
    return header + obfCode + footer;
  }

  // ========== GẮN SỰ KIỆN ==========
  const inputEl = document.getElementById('input');
  const outputEl = document.getElementById('output');
  const statusEl = document.getElementById('status');

  document.getElementById('obfuscateBtn').addEventListener('click', () => {
    try {
      const original = inputEl.value;
      if (!original.trim()) {
        statusEl.textContent = 'Please paste some Lua code.';
        return;
      }
      statusEl.textContent = 'Obfuscating...';
      const result = obfuscate(original);
      outputEl.value = result;
      statusEl.textContent = 'Obfuscation complete. Code is heavily armored.';
    } catch (err) {
      statusEl.textContent = 'Error: ' + err.message;
      outputEl.value = '';
    }
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    const text = outputEl.value;
    if (!text) {
      statusEl.textContent = 'Nothing to copy.';
      return;
    }
    navigator.clipboard.writeText(text).then(() => statusEl.textContent = 'Copied!')
      .catch(() => statusEl.textContent = 'Copy failed');
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    inputEl.value = '';
    outputEl.value = '';
    statusEl.textContent = 'Cleared.';
