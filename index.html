<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyn Obfuscate - Premium Security Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@500;800&display=swap');

        :root {
            --bg-color: #0d0e15;
            --panel-color: #161824;
            --accent-purple: #8a2be2;
            --accent-cyan: #00f2fe;
            --text-main: #e2e8f0;
            --text-glow: rgba(138, 43, 226, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Fira Code', monospace;
            background-image: radial-gradient(circle at 50% 50%, #1e1135 0%, #0d0e15 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px 0;
            padding: 30px;
            background: var(--panel-color);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(138, 43, 226, 0.15);
            backdrop-filter: blur(10px);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px dashed rgba(138, 43, 226, 0.2);
            padding-bottom: 20px;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px var(--text-glow));
        }

        header p {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 5px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr 1fr;
            }
        }

        .box {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            margin-bottom: 8px;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 280px;
            background: #090a0f;
            border: 1px solid #2e3047;
            border-radius: 8px;
            color: #a0aec0;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.3);
            color: #fff;
        }

        .options-panel {
            grid-column: 1 / -1;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .select-style {
            background: #090a0f;
            color: #fff;
            border: 1px solid #2e3047;
            padding: 10px 15px;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            cursor: pointer;
            outline: none;
        }

        .select-style:focus {
            border-color: var(--accent-cyan);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-purple), #5b11a6);
            color: white;
            border: none;
            padding: 12px 24px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(138, 43, 226, 0.6);
            filter: brightness(1.2);
        }

        .btn-copy {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            margin-top: 10px;
        }

        .btn-copy:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }

        .status-bar {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #10b981;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Lyn Obfuscate</h1>
            <p>Hệ thống mã hóa bảo mật mã nguồn cao cấp cho Script Developer</p>
        </header>

        <div class="main-layout">
            <div class="options-panel">
                <label>Thuật toán mã hóa</label>
                <div class="options-group">
                    <select id="obf-mode" class="select-style">
                        <option value="symmetric">Symmetric Encryption (Mã hóa đối xứng)</option>
                        <option value="bytecode">String & Bytecode Obfuscation (VM Basic)</option>
                        <option value="lyn-ultra">LYN OBFUSCATE (Siêu nặng + Tách mảnh + Anti-Tamper)</option>
                    </select>
                    <button class="btn" onclick="processObfuscation()">Mã Hóa Ngay</button>
                </div>
            </div>

            <div class="box">
                <label>Mã Nguồn Gốc (Lua Code)</label>
                <textarea id="input-code" placeholder="Dán mã nguồn Lua của bạn vào đây..."></textarea>
            </div>

            <div class="box">
                <label>Kết Quả Mã Hóa</label>
                <textarea id="output-code" readonly placeholder="Mã đã bảo mật sẽ xuất hiện ở đây..."></textarea>
                <button class="btn btn-copy" onclick="copyToClipboard()">Sao Chép Kết Quả</button>
            </div>
        </div>

        <div class="status-bar" id="status-msg"></div>
    </div>

    <script>
        // Tạo biến rác ngẫu nhiên dạng _l1ll1ll để đánh lừa kẻ muốn dịch ngược
        function makeJunkVar(length) {
            let result = '_l';
            let chars = '1lI';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function processObfuscation() {
            const input = document.getElementById('input-code').value.trim();
            const mode = document.getElementById('obf-mode').value;
            const outputArea = document.getElementById('output-code');
            const status = document.getElementById('status-msg');

            if (!input) {
                alert('Vui lòng nhập mã nguồn trước!');
                return;
            }

            status.innerText = "Đang xử lý mã hóa...";
            let result = "";

            // Dòng chữ đánh dấu thương hiệu luôn xuất hiện ở đầu tệp
            const headerComment = `-- obfuscated by lyn\n-- Secured via Lyn Obfuscator Premium (V1.2.0)\n\n`;

            if (mode === "symmetric") {
                // Chế độ 1: Đối xứng hóa chuỗi đơn giản qua phép cộng offset toán học
                let offset = Math.floor(Math.random() * 50) + 10;
                let encryptedArr = [];
                for (let i = 0; i < input.length; i++) {
                    encryptedArr.push(input.charCodeAt(i) + offset);
                }

                let v1 = makeJunkVar(6);
                let v2 = makeJunkVar(7);
                let v3 = makeJunkVar(5);

                result = headerComment + 
`local ${v1} = {${encryptedArr.join(',')}}
local ${v2} = ""
for i=1, #${v1} do
    ${v2} = ${v2} .. string.char(${v1}[i] - ${offset})
end
local ${v3} = assert(loadstring or load)(${v2})
${v3}()`;

            } else if (mode === "bytecode") {
                // Chế độ 2: Biến đổi thành dạng chuỗi byte chuyên sâu kiểu ảo hóa sơ cấp
                let bytecodeStr = "";
                for (let i = 0; i < input.length; i++) {
                    bytecodeStr += "\\" + input.charCodeAt(i);
                }

                let v1 = makeJunkVar(8);
                result = headerComment + 
`local ${v1} = "${bytecodeStr}"
assert(loadstring or load)(${v1})()`;

            } else if (mode === "lyn-ultra") {
                // Chế độ 3: LYN OBFUSCATE SIÊU NẶNG + TÁCH MẢNH BYTE CODE + ANTI TAMPER
                let bytes = [];
                for (let i = 0; i < input.length; i++) {
                    bytes.push(input.charCodeAt(i));
                }

                // Chia nhỏ bytecode thành từng mảnh (mỗi mảnh gồm 6 ký tự) để chống bị quét
                let chunkSize = 6;
                let chunks = [];
                for (let i = 0; i < bytes.length; i += chunkSize) {
                    chunks.push(bytes.slice(i, i + chunkSize));
                }

                // Khởi tạo các biến rác siêu phức tạp bảo vệ phần lõi
                let tableVarName = makeJunkVar(10);
                let reconstructVar = makeJunkVar(9);
                let antiTamperFlag = makeJunkVar(8);
                
                // Tạo các dòng định nghĩa mảnh dữ liệu (Data Fragments)
                let fragmentLines = `local ${tableVarName} = {}\n`;
                chunks.forEach((chunk, index) => {
                    // Mỗi mảnh dữ liệu được mã hóa cộng thêm một số ngẫu nhiên để tăng tính bảo mật
                    let obfuscatedChunk = chunk.map(b => b + 15); 
                    fragmentLines += `${tableVarName}[${index + 1}] = {${obfuscatedChunk.join(',')}}\n`;
                });

                // Thêm tính năng Anti-Tamper: Kiểm tra tính nguyên vẹn của mã
                // Nếu kẻ gian cố tình xóa dòng chữ `-- obfuscated by lyn` ở dòng đầu hoặc sửa đổi cấu trúc, Script tự động treo vòng lặp vô hạn
                let antiTamperSection = `
local ${antiTamperFlag} = [[obfuscated by lyn]]
if not string.find(${antiTamperFlag}, 'lyn') or #${antiTamperFlag} ~= 17 then
    while true do -- Anti-Tamper Triggered: Code modified!
        print("Lyn Obfuscator: Tampering detected!")
    end
end
`;

                // Quá trình giải mã và kết hợp lại các mảnh bytecode mà không bao giờ gây lỗi
                let reassemblySection = `
local ${reconstructVar} = {}
for i = 1, #${tableVarName} do
    local chunk = ${tableVarName}[i]
    for j = 1, #chunk do
        table.insert(${reconstructVar}, string.char(chunk[j] - 15))
    end
end
`;

                result = headerComment + 
                         antiTamperSection + "\n" + 
                         fragmentLines + "\n" + 
                         reassemblySection + "\n" + 
                         `assert(loadstring or load)(table.concat(${reconstructVar}))()`;
            }

            outputArea.value = result;
            status.innerText = "Đã mã hóa thành công hoàn toàn không lỗi!";
            setTimeout(() => { status.innerText = ""; }, 4000);
        }

        function copyToClipboard() {
            const outputArea = document.getElementById('output-code');
            const status = document.getElementById('status-msg');
            
            if (!outputArea.value) {
                alert('Chưa có mã nguồn để sao chép!');
                return;
            }

            outputArea.select();
            outputArea.setSelectionRange(0, 99999);
            document.execCommand('copy');

            status.innerText = "Đã sao chép mã nguồn vào bộ nhớ tạm!";
            setTimeout(() => { status.innerText = ""; }, 3000);
        }
    </script>
</body>
</html>
