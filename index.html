<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyn Hub - Get Script</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #1a162b;
            --accent-color: #bb86fc;
            --tiktok-color: #fe2c55;
            --youtube-color: #ff0000;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            user-select: none; /* Chống bôi đen copy bậy */
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fe2c55, #ff0000, #bb86fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .btn-zone {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s, filter 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn-link:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        .btn-tiktok { background-color: var(--tiktok-color); }
        .btn-youtube { background-color: var(--youtube-color); }

        .btn-verify {
            background-color: #31a24c;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            display: none;
        }

        .countdown-text {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin: 15px 0;
            display: none;
        }

        .script-box {
            display: none;
            text-align: left;
            margin-top: 10px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .script-title {
            font-size: 1.3rem;
            color: #4cd137;
            text-align: center;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .script-sub {
            font-size: 1rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 15px;
        }

        .code-container {
            position: relative;
            background-color: #0b0914;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        textarea {
            width: 100%;
            height: 100px;
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            user-select: text; /* Cho phép copy ở ô này */
        }

        .btn-copy {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy:hover { background-color: #d2b4ff; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="gate-zone">
            <h1>Lyn Hub</h1>
            <p class="subtitle">Vui lòng hoàn thành nhiệm vụ để mở khóa Script</p>
            
            <div class="btn-zone">
                <button class="btn-link btn-tiktok" id="tk-btn">
                    <i class="fab fa-tiktok"></i> Follow TikTok
                </button>
                <button class="btn-link btn-youtube" id="yt-btn">
                    <i class="fab fa-youtube"></i> Đăng ký YouTube
                </button>
            </div>

            <button class="btn-verify" id="verify-btn">XÁC NHẬN ĐÃ HOÀN THÀNH</button>
            <div class="countdown-text" id="countdown-zone">Đang kiểm tra... Vui lòng đợi <span id="timer">5</span> giây</div>
        </div>

        <div class="script-box" id="script-zone">
            <p class="script-title"><i class="fas fa-check-circle"></i> Script của bạn đây</p>
            <p class="script-sub">Lyn Hub Kick a Lucky Blox</p>
            
            <div class="code-container">
                <textarea id="script-code" readonly placeholder="Đang tải cấu trúc script..."></textarea>
            </div>

            <button class="btn-copy" id="copy-btn">
                <i class="fas fa-copy"></i> Sao chép Script
            </button>
        </div>
    </div>

    <script>
        // Các chuỗi dữ liệu đã được mã hóa thành Base64 để ẩn giấu hoàn toàn
        const _d1 = "aHR0cHM6Ly93d3cudGlrdG9rLmNvbS9AdGFfdGhpZXVfbmFuZ19kb19sYV9ubz9fcj0xJl90PVpTLTk3TEU1Z2RMVG12"; // TikTok URL
        const _d2 = "aHR0cHM6Ly95b3V0dWJlLmNvbS9AbHluX2dhbWluZ2dhbWVyP3NpPWpKeUJINDBmWUR4SVAxd0I="; // YouTube URL
        const _d3 = "bG9hZHN0cmluZyhnYW1lOkh0dHBHZXQoImh0dHBzOi8vcmF3LmdpdGh1YnVzZXJjb250ZW50LmNvbS9zb252dWFraWxsc29uLWRvdGNvbS9Tb2IvbWFpbi9TY3JpcHQlMjBraWNrJTIwYSUyMGx1Y2t5JTIwYmxveCUyMGJ5JTIwTHluJTIwbm8lMjBrZXklMjBiZXN0IikpKCk="; // Script URL

        const tkBtn = document.getElementById('tk-btn');
        const ytBtn = document.getElementById('yt-btn');
        const verifyBtn = document.getElementById('verify-btn');
        const countdownZone = document.getElementById('countdown-zone');
        const timerText = document.getElementById('timer');
        const gateZone = document.getElementById('gate-zone');
        const scriptZone = document.getElementById('script-zone');
        const copyBtn = document.getElementById('copy-btn');
        const scriptCode = document.getElementById('script-code');

        let clickTK = false;
        let clickYT = false;

        // Kích hoạt link khi bấm (không hiện góc màn hình khi di chuột qua)
        tkBtn.addEventListener('click', () => {
            window.open(atob(_d1), '_blank');
            clickTK = true;
            checkStatus();
        });

        ytBtn.addEventListener('click', () => {
            window.open(atob(_d2), '_blank');
            clickYT = true;
            checkStatus();
        });

        function checkStatus() {
            if (clickTK && clickYT) {
                verifyBtn.style.display = 'block';
            }
        }

        verifyBtn.addEventListener('click', () => {
            verifyBtn.style.display = 'none';
            countdownZone.style.display = 'block';
            
            let time = 5;
            const timer = setInterval(() => {
                time--;
                timerText.textContent = time;
                if (time <= 0) {
                    clearInterval(timer);
                    gateZone.style.display = 'none';
                    scriptZone.style.display = 'block';
                    // Lúc này mới tiến hành giải mã đoạn code đưa vào giao diện công khai
                    scriptCode.value = atob(_d3);
                }
            }, 1000);
        });

        copyBtn.addEventListener('click', () => {
            scriptCode.select();
            scriptCode.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(scriptCode.value).then(() => {
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Đã sao chép!';
                copyBtn.style.backgroundColor = '#4cd137';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fas fa-copy"></i> Sao chép Script';
                    copyBtn.style.backgroundColor = 'var(--accent-color)';
                }, 2000);
            });
        });

        // Chống bấm chuột phải để xem nhanh phần tử (F12 vẫn vào được nhưng code đã bị rối)
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
