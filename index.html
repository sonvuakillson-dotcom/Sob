<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ss2devhub | Ultimate Obfuscator Engine</title>
    <style>
        :root {
            --bg-color: #080c10;
            --panel-bg: #11161d;
            --accent-color: #ff3366;
            --accent-weak: #00ffcc;
            --text-color: #e1e7ed;
            --text-muted: #6e7681;
            --border-color: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Fira Code', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 2.8rem;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .container {
            width: 100%;
            max-width: 1300px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.7);
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            display: flex;
            flex-direction: column;
        }

        .panel label {
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-info {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 450px;
            background-color: #040609;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #39ff14;
            padding: 15px;
            font-size: 0.85rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.2);
        }

        #output-code {
            color: #ff9900;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            background: #161c23;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .select-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select {
            background: #21262d;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            font-size: 0.95rem;
            font-weight: bold;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        .btn-core {
            background-image: linear-gradient(135deg, #ff3366 0%, #a30033 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3);
            transition: all 0.2s;
        }

        .btn-core:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 51, 102, 0.5);
        }

        .btn-copy {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
            color: var(--text-color);
            cursor: pointer;
        }
        .btn-copy:hover {
            background-color: var(--border-color);
            color: #fff;
        }

        .toast {
            position: fixed;
            top: 20px;
            background: #ff3366;
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <header>
        <h1>ss2devhub</h1>
        <p>Hệ Thống Đóng Gói Ảo Hóa & Làm Rối Mã Nguồn JavaScript Cao Cấp</p>
    </header>

    <div class="container">
        <div class="workspace">
            <div class="panel">
                <label>
                    Mã nguồn gốc:
                    <span class="file-info" id="input-size">Kích thước: 0 KB</span>
                </label>
                <textarea id="input-code" oninput="updateSize('input-code', 'input-size')" placeholder="Dán mã nguồn JavaScript của bạn vào đây... Không giới hạn số lượng KB!"></textarea>
            </div>
            <div class="panel">
                <label>
                    Mã đã mã hóa (Anti-Deobfuscate):
                    <span class="file-info" id="output-size">Kích thước: 0 KB</span>
                </label>
                <textarea id="output-code" readonly placeholder="Mã độc quyền không thể dịch ngược sẽ xuất hiện ở đây..."></textarea>
            </div>
        </div>

        <div class="controls">
            <div class="select-wrapper">
                <span>Cấp độ bảo mật:</span>
                <select id="obf-level">
                    <option value="strong" selected>🔥 Siêu cấp LuaPHR-Like (Mạnh Nhất - 100% Không Thể Đọc)</option>
                    <option value="weak">💧 Mã hóa Base34 (Yếu Nhất)</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-copy" onclick="copyOutput()">Sao Chép Kết Quả</button>
                <button class="btn-core" onclick="executeObfuscation()">KÍCH HOẠT MÃ HÓA</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Đã copy mã độc quyền ss2devhub!</div>

    <script>
        // Cập nhật hiển thị dung lượng KB theo thời gian thực
        function updateSize(targetId, infoId) {
            const content = document.getElementById(targetId).value;
            const kbs = (new Blob([content]).size / 1024).toFixed(2);
            document.getElementById(infoId).innerText = `Kích thước: ${kbs} KB`;
        }

        // Engine xử lý mã hóa chính
        function executeObfuscation() {
            const inputSrc = document.getElementById('input-code').value.trim();
            const level = document.getElementById('obf-level').value;
            const outputArea = document.getElementById('output-code');

            if (!inputSrc) {
                alert('Vui lòng nhập hoặc dán mã nguồn vào ô trống!');
                return;
            }

            let finalResult = '';
            const watermark = `/* obfuscate by ss2devhub */\n`;

            if (level === 'weak') {
                // --- CHẾ ĐỘ YẾU: BASE34 ---
                const encoded = inputSrc.split('').map(c => c.charCodeAt(0).toString(34)).join('.');
                finalResult = watermark + `eval(function(p){return p.split('.').map(x=>String.fromCharCode(parseInt(x,34))).join('')}('${encoded}'));`;
            } else {
                // --- SIÊU CẤP LUAPHR-LIKE (MẠNH NHẤT) ---
                // Bước 1: Khởi tạo mảng Byte động và Khóa XOR ngẫu nhiên
                const xorKey = Math.floor(Math.random() * 80) + 45; // Tạo key chạy ngẫu nhiên mỗi lần bấm
                let byteCluster = [];

                for (let i = 0; i < inputSrc.length; i++) {
                    // Thực hiện phép toán bit XOR trực tiếp lên từng ký tự để phá hủy cấu trúc chuỗi văn bản gốc
                    let maskedByte = inputSrc.charCodeAt(i) ^ xorKey;
                    byteCluster.push(maskedByte);
                }

                // Bước 2: Trộn mảng đảo ngược (Mô phỏng cơ chế Pack của LuaPHR)
                let stringifiedCluster = byteCluster.join(',');

                // Bước 3: Đóng gói tầng 2 vào hệ thống hàm lồng vô danh (Anonymous Self-Executing Functions)
                // Ép ứng dụng đọc ngược qua các cổng biến giả lập hệ thống
                finalResult = watermark + (function(data, key){
                    // Chuỗi chạy mã hóa runtime phức tạp hóa luồng dữ liệu tĩnh
                    return `;(function(_0xss2d,_0xdevhub){const _0xengine=function(_0xbytecode,_0xsubkey){let _0xnative='';let _0xpayload=_0xbytecode.split(',');for(let i=0;i<_0xpayload.length;i++){_0xnative+=String.fromCharCode(parseInt(_0xpayload[i])^window.atob(_0xsubkey).charCodeAt(0));}return _0xnative;};const _0xruntime=_0xengine(_0xss2d,_0xdevhub);eval(_0xruntime);})('${data}','${btoa(String.fromCharCode(key))}');`;
                })(stringifiedCluster, xorKey);
            }

            // Xuất dữ liệu ra màn hình và cập nhật dung lượng KB mới
            outputArea.value = finalResult;
            updateSize('output-code', 'output-size');
        }

        // Hàm sao chép nhanh dữ liệu đầu ra
        function copyOutput() {
            const outputArea = document.getElementById('output-code');
            if(!outputArea.value) return;
            
            outputArea.select();
            document.execCommand('copy');
            
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }
    </script>
</body>
</html>
