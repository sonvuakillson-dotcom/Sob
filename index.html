<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyn AI - Vietsub & Lồng Tiếng Pro (Gemini Engine)</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #121212; color: #ffffff; max-width: 850px; margin: 0 auto; padding: 20px; text-align: center; }
        h1 { color: #00ff88; margin-bottom: 5px; }
        .upload-box { border: 2px dashed #00ff88; padding: 25px; border-radius: 12px; margin-bottom: 20px; background: #1e1e1e; }
        button { background-color: #00ff88; color: #000; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        button:hover { background-color: #00cc6a; transform: scale(1.02); }
        .video-container { position: relative; display: inline-block; width: 100%; margin-top: 20px; border-radius: 12px; overflow: hidden; box-shadow: 0px 10px 30px rgba(0,0,0,0.5); background: #000; }
        #player { width: 100%; display: none; vertical-align: bottom; }
        /* Style chữ Vietsub đè màn hình chuẩn phim chiếu rạp */
        #sub-overlay { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.75); color: #ffffff; padding: 6px 16px; border-radius: 6px; font-size: 22px; font-weight: bold; text-align: center; pointer-events: none; display: none; max-width: 85%; white-space: pre-line; text-shadow: 2px 2px 4px #000000; line-height: 1.4; z-index: 10; }
        #status { margin-top: 15px; color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🎙️ Lyn AI - Hệ Thống Vietsub & Lồng Tiếng Gemini</h1>
    <p style="color: #aaa;">Sử dụng siêu trí tuệ Gemini 1.5 Flash bóc băng và dịch thuật không lỗi.</p>

    <div class="upload-box">
        <input type="file" id="videoFile" accept="video/*, audio/*">
        <div style="margin-top: 10px;">
            <input type="checkbox" id="enableVoice" checked>
            <label for="enableVoice">🎙️ Bật lồng tiếng chuẩn giọng Việt Nam (Lyn Voice)</label>
        </div>
        <button onclick="processVideo()">🚀 Xử Lý Vietsub Ngay</button>
        <div id="status">Sẵn sàng! Hãy chọn file video của bạn (Hỗ trợ file 5-10 phút).</div>
    </div>

    <div class="video-container">
        <video id="player" controls crossorigin="anonymous"></video>
        <div id="sub-overlay"></div>
    </div>

    <script>
        // Tôi đã gắn sẵn chính xác Key của ông vào đây.
        const GEMINI_API_KEY = "AQ.Ab8RN6In958--tilTkn5WfGtfdaPmb6EFE4Ygkt_-eeiGR_RGw";
        let globalCues = [];
        let ttsAudio = new Audio();

        function setStatus(msg) { document.getElementById('status').innerText = msg; }

        async function processVideo() {
            const fileInput = document.getElementById('videoFile');
            const file = fileInput.files[0];
            if (!file) return alert("Vui lòng chọn file video cái đã ông bạn!");

            const video = document.getElementById('player');
            const subOverlay = document.getElementById('sub-overlay');
            
            // Khởi tạo lại trạng thái ban đầu để tránh crash dữ liệu cũ
            globalCues = [];
            subOverlay.innerText = "";
            subOverlay.style.display = "none";
            ttsAudio.pause();
            
            video.style.display = 'block';
            video.src = URL.createObjectURL(file);

            try {
                // BƯỚC 1: Tách và nén âm thanh xuống chuẩn 12kHz Mono siêu nhẹ để nhét vừa băng thông API
                setStatus("⚙️ Đang bóc tách luồng âm thanh và tối ưu dung lượng...");
                const compressedAudioBlob = await extractAndCompressAudio(file);

                // Chuyển Audio Blob sang chuỗi Base64 để gửi trực tiếp trong request JSON của Gemini
                setStatus("📦 Đang mã hóa dữ liệu âm thanh đầu vào...");
                const base64Audio = await blobToBase64(compressedAudioBlob);

                // Lọc sạch API Key: Loại bỏ toàn bộ khoảng trắng, ký tự Unicode, tiếng Việt vô tình dính vào để chống lỗi ISO-8859-1
                const cleanKey = GEMINI_API_KEY.trim().replace(/[^\x20-\x7E]/g, '');

                // BƯỚC 2: Triệu gọi Gemini 1.5 Flash xử lý trọn gói (Nghe + Dịch + Xuất JSON mốc thời gian)
                setStatus("🚀 Đang gửi dữ liệu qua Gemini AI để xử lý Vietsub siêu tốc...");
                
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`;
                
                const response = await fetch(url, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "x-goog-api-key": cleanKey // Đã được bọc thép chống lỗi ký tự lạ
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Nghe đoạn âm thanh này. Hãy bóc băng (speech-to-text) và dịch toàn bộ nội dung sang Tiếng Việt chuẩn xác, mượt mà văn cảnh như phim chiếu rạp, không lỗi phụ đề. Xuất kết quả bắt buộc dưới dạng một mảng JSON (JSON Array), mỗi phần tử là một object có cấu trúc chính xác như sau: {\"start\": số_giây_bắt_đầu, \"end\": số_giây_kết_thúc, \"text\": \"câu_tiếng_việt_đã_dịch\"}. Cần đảm bảo các mốc thời gian start và end (kiểu số) khớp chính xác với lời thoại trong âm thanh. Không trả về bất kỳ ký tự nào khác ngoài chuỗi JSON sạch." },
                                { inlineData: { mimeType: "audio/wav", data: base64Audio } }
                            ]
                        }],
                        generationConfig: {
                            responseMimeType: "application/json" // Ép cấu trúc đầu ra luôn là JSON sạch, chống crash chữ lạ
                        }
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error("Lỗi kết nối Gemini API. Hãy kiểm tra lại tính chính xác của API Key. Chi tiết: " + errText);
                }

                const resJson = await response.json();
                
                // Trích xuất chuỗi JSON mà Gemini trả về và nạp vào mảng điều khiển phụ đề
                const rawText = resJson.candidates[0].content.parts[0].text;
                globalCues = JSON.parse(rawText);

                if (!Array.isArray(globalCues)) {
                    throw new Error("Dữ liệu AI trả về không đúng cấu trúc mảng. Vui lòng bấm thử lại.");
                }

                // BƯỚC 3: Đồng bộ hóa phụ đề đè màn hình và động cơ giọng lồng tiếng Việt
                initSubAndVoiceEngine(video, subOverlay);
                setStatus("✅ Hoàn tất 100%! Bấm nút Play trên video để hưởng thụ thành quả.");

            } catch (error) {
                setStatus("❌ Gặp sự cố xử lý: " + error.message);
                console.error(error);
            }
        }

        // Động cơ tối ưu âm thanh: Hạ tần số xuống 12000Hz, ép về 1 kênh Mono để tối giản dung lượng tối đa
        async function extractAndCompressAudio(file) {
            const arrayBuffer = await file.arrayBuffer();
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 12000 });
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            const numOfChannels = 1; 
            const length = audioBuffer.length;
            const sampleRate = 12000;
            const offlineCtx = new OfflineAudioContext(numOfChannels, length, sampleRate);
            const source = offlineCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(offlineCtx.destination);
            source.start();
            
            const renderedBuffer = await offlineCtx.startRendering();
            return audioBufferToWav(renderedBuffer);
        }

        function audioBufferToWav(buffer) {
            const numOfChan = buffer.numberOfChannels;
            const length = buffer.length * numOfChan * 2 + 44;
            const out = new ArrayBuffer(length);
            const view = new DataView(out);
            const channels = [];
            let sample, offset = 0, pos = 0;

            const setUint16 = (data) => { view.setUint16(pos, data, true); pos += 2; };
            const setUint32 = (data) => { view.setUint32(pos, data, true); pos += 4; };

            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157); setUint32(0x20746d66); 
            setUint32(16); setUint16(1); setUint16(numOfChan); setUint32(buffer.sampleRate);
            setUint32(buffer.sampleRate * 2 * numOfChan); setUint16(numOfChan * 2); setUint16(16);
            setUint32(0x61746164); setUint32(length - pos - 4);

            for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));
            while (pos < length) {
                for (let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    view.setInt16(pos, sample, true); pos += 2;
                }
                offset++;
            }
            return new Blob([out], { type: "audio/wav" });
        }

        // Tiện ích chuyển đổi file nhị phân Blob sang chuỗi ký tự Base64
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        // Bộ xử lý quét mốc thời gian thực của Video để dập chữ lên màn hình và lồng tiếng Việt đúng nhịp
        function initSubAndVoiceEngine(video, subOverlay) {
            let lastText = "";
            video.addEventListener('timeupdate', () => {
                const t = video.currentTime;
                // Tìm kiếm câu phụ đề tương thích với giây hiện tại của video
                const activeCue = globalCues.find(c => t >= c.start && t <= c.end);
                
                if (activeCue) {
                    if (lastText !== activeCue.text) {
                        lastText = activeCue.text;
                        subOverlay.innerText = activeCue.text;
                        subOverlay.style.display = 'block'; // Đè hiển thị chữ trực tiếp lên khung hình phim
                        playVietnameseVoice(activeCue.text); // Gọi giọng lồng tiếng chuẩn
                    }
                } else { lastText = ""; subOverlay.style.display = 'none'; }
            });
            video.addEventListener('pause', () => ttsAudio.pause());
            video.addEventListener('seeking', () => ttsAudio.pause());
        }

        // Bộ phát giọng đọc chuẩn Tiếng Việt mượt mà bám đuổi theo phụ đề
        function playVietnameseVoice(text) {
            if (!document.getElementById('enableVoice').checked) return;
            ttsAudio.pause();
            const cleanText = text.replace(/\n/g, " ");
            ttsAudio.src = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encodeURIComponent(cleanText)}`;
            ttsAudio.play().catch(() => {});
        }
    </script>
</body>
</html>
